[features]
# Cross-crate test support only (see secure::key::use_test_master_key); dev-dependencies
# activate it, a normal build never does.
test-utils = []

[package]
name = "swiss-core"
version.workspace = true
description = "Platform primitives for swiss: paths, logging, sealed envelopes, process trees, PTYs and DPAPI."
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# Only for DATA_DIR_LOCK under the test-utils feature (dev-dependencies activate it); sync
# alone, and tokio is already in the graph through every consumer.
tokio = { version = "1", default-features = false, features = ["sync"] }
thiserror = "2"
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
# RFC3339 timestamps for the gateway's own logging — chrono appears only under sqlx, in swiss-mcp.
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing", "macros"] }
rand = "0.9"
# The sealed-envelope format (docs/05 §1) — frozen, byte-identical to the Node build.
hkdf = "0.13"
sha2 = "0.11"
aes-gcm = "0.11"
# Pinned to rmcp's own base64 major so the graph holds ONE copy (cargo tree -d stays clean).
base64 = "0.23"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",           # DPAPI, replacing the powershell spawn
    "Win32_System_Registry",                 # MachineGuid, direct registry read
    "Win32_System_Threading",                # process-tree walk + open-process
    "Win32_System_JobObjects",               # KILL_ON_JOB_CLOSE subtree kill for proc children
    "Win32_System_Diagnostics_ToolHelp",     # Toolhelp32 snapshot, replacing the other powershell spawn
    "Win32_System_ProcessStatus",            # GetProcessMemoryInfo for the memory view
    "Win32_System_Console",                  # ConPTY: Create/Resize/ClosePseudoConsole
    "Win32_NetworkManagement_IpHelper",      # GetExtendedTcpTable, replacing netstat.exe
    "Win32_Networking_WinSock",              # AF_INET/AF_INET6 for the TCP owner table
    "Win32_System_Pipes",                    # ConPTY: the two anonymous pipes + PeekNamedPipe
    # Named explicitly although Win32_Security_Cryptography already pulls it in: CreatePipe,
    # CreateProcessW and CreateJobObjectW all name SECURITY_ATTRIBUTES, and a reader deleting
    # DPAPI one day should not silently take the pty and the job guard down with it.
    "Win32_Security",
] }

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }