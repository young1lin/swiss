[package]
name = "swiss-host"
version.workspace = true
description = "The swiss plugin host: descriptors, lifecycle, actions, runs, the process supervisor, config and the loopback boundary."
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
swiss-core = { path = "../swiss-core" }
# The event bus (SPEC §bus). The host holds the hub; this crate does not name a subsystem.
swiss-bus = { path = "../swiss-bus" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "time", "signal", "sync", "fs", "io-util", "process"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing", "macros"] }
futures-core = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.11"
encoding_rs = { version = "0.8", default-features = false }
# A redis console line and a stream filter line split the way a shell splits (SPEC §data.streams,
# dbbrowser::split_words): `data~"last": 12` is one term with a space in it. A shell-style
# splitter is a solved problem and a poor thing to hand-write; shlex is already in the tree
# through cc's build graph (same version resolves) and has no dependencies of its own.
shlex = "2"
# The module history engine (SPEC §host.history, planned): sqlx 0.9 over the bundled SQLite —
# the same engine family swiss-mcp's adapters use, no second runtime, no system DLL. The
# lockfile pins libsqlite3-sys 0.37.0, whose amalgamation is SQLite 3.51.3: the first release
# with the WAL-reset race fixed (sqlite.org/wal.html#walresetbug). history::engine gates
# every open on that fact, so bumping the pin without re-proving the gate turns tests red,
# and an unfixed engine can never reach WAL mode. Features stay at runtime-tokio + sqlite:
# the query() runtime only, never the compile-time query! macros (SPEC §arch.deps).
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
# The history body codec (SPEC §host.history, planned): LZ4 block only, pure Rust, zero
# dependencies of its own — no frame format, no C. safe-decode + checked-decode keep a
# corrupt or truncated block an Err instead of UB or a panic (bodies are read back from
# disk, never trusted); raw blocks are kept when compression would expand them.
lz4_flex = { version = "0.14", default-features = false, features = [
    "std",
    "safe-decode",
    "checked-decode",
] }
# The sealed chunk wrapper carries its payload as base64 inside the frozen envelope's UTF-8
# plaintext. Pinned to the same 0.23 the tree already holds through swiss-core and rmcp —
# one copy (cargo tree -d stays clean).
base64 = "0.23"

[dev-dependencies]
# test-utils pins the deterministic master key for this crate's own test binaries.
swiss-core = { path = "../swiss-core", version = "0.1.0", features = ["test-utils"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }