[package]
name = "swiss-host"
version.workspace = true
description = "The swiss plugin host: descriptors, lifecycle, actions, runs, the process supervisor, config and the loopback boundary."
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
swiss-core = { path = "../swiss-core" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "time", "signal", "sync", "fs", "io-util", "process"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing", "macros"] }
futures-core = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.11"
encoding_rs = { version = "0.8", default-features = false }
# A stream filter line splits the way a shell splits (docs/49): `data~"last": 12` is one term
# with a space in it. Same crate, same version the redis console already uses in swiss-mcp —
# no new code units, no dependencies of its own.
shlex = "2"

[dev-dependencies]
# test-utils pins the deterministic master key for this crate's own test binaries.
swiss-core = { path = "../swiss-core", version = "0.1.0", features = ["test-utils"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }