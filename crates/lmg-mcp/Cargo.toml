[package]
name = "lmg-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
lmg-core = { path = "../lmg-core" }
lmg-host = { path = "../lmg-host" }
# The rmcp `macros` feature stays off: servers implement ServerHandler by hand, mirroring the
# Node build's setRequestHandler exactly and keeping pastey out of the build.
rmcp = { version = "3.2", default-features = false, features = [
    "server", "client", "transport-streamable-http-server",
    "transport-child-process",
] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "time", "signal", "sync", "fs", "io-util", "process"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
futures-core = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The direct DB adapters. No TLS features on purpose: connections are loopback or
# tunnel-forwarded, so DB TLS would add a second crypto stack for nothing.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql", "postgres", "json", "chrono", "bigdecimal"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
bigdecimal = { version = "0.4", default-features = false }
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "aio", "connection-manager"] }
encoding_rs = { version = "0.8", default-features = false }
mongodb = { version = "3", optional = true, default-features = false, features = ["compat-3-0-0", "rustls-tls"] }
base64 = "0.23"
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing", "macros"] }
rand = "0.8"

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
libc = "0.2"

[dev-dependencies]
lmg-core = { path = "../lmg-core", features = ["test-utils"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "time", "sync", "test-util"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
serde = { version = "1", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
async-trait = "0.1"
anyhow = "1"

[features]
default = []
# Cross-crate test support (see calls::test_log); dev-dependencies only.
test-utils = []
# The heaviest driver (ADR-004): off by default, ON in the shipped release via the bin crate's
# forwarding feature of the same name.
mongo = ["dep:mongodb"]
