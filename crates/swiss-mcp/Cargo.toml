[package]
name = "swiss-mcp"
version.workspace = true
description = "The swiss MCP gateway plugin: adapters, definitions, revisions, OAuth and traffic."
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
swiss-core = { path = "../swiss-core" }
swiss-host = { path = "../swiss-host" }
# The rmcp `macros` feature stays off: servers implement ServerHandler by hand, mirroring the
# Node build's setRequestHandler exactly and keeping pastey out of the build.
rmcp = { version = "3.2", default-features = false, features = [
    "server", "client", "transport-streamable-http-server",
    "transport-child-process",
] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "time", "signal", "sync", "fs", "io-util", "process"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
futures-core = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The direct DB adapters. No TLS features on purpose: connections are loopback or
# tunnel-forwarded, so DB TLS would add a second crypto stack for nothing. Without TLS, MySQL
# 8's caching_sha2_password sends the password encrypted to the server's RSA key whenever the
# server has not cached the login, so `mysql-rsa` stays on: sqlx 0.9 made it opt-in, and
# without it every such login fails with "RSA auth backend disabled".
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "mysql", "mysql-rsa", "postgres", "json", "chrono", "bigdecimal"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
bigdecimal = { version = "0.4", default-features = false }
redis = { version = "1.7", default-features = false, features = ["tokio-comp", "aio", "connection-manager"] }
encoding_rs = { version = "0.8", default-features = false }
base64 = "0.23"
# PKCE S256 challenges for MCP OAuth (SPEC §mcp.oauth) — the same sha2 the graph already carries
# through swiss-core's HKDF, same version, so this adds zero new code units (cargo tree -d clean).
sha2 = "0.11"
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing", "macros"] }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
libc = "0.2"

[dev-dependencies]
swiss-core = { path = "../swiss-core", version = "0.1.0", features = ["test-utils"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "time", "sync", "test-util"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
serde = { version = "1", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
async-trait = "0.1"
anyhow = "1"

[features]
default = []
# Cross-crate test support (see calls::test_log); dev-dependencies only.
test-utils = []
