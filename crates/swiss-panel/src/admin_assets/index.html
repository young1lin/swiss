  <meta charset="utf-8" />

  <link rel="stylesheet" href="/admin/styles/base.css">
  <link rel="stylesheet" href="/admin/styles/views.css">
  <script>
    /* Resolve the appearance before the first paint. Doing it in the main script instead means a
       full-brightness white panel flashes past on the way into the dark one, which is exactly what
       someone reaching for dark mode is trying to get away from. applyTheme() below repeats this;
       this copy exists only to beat the paint. */
    (function () {
      var pref = "auto";
      try { pref = localStorage.getItem("swiss_theme") || "auto"; } catch (e) { /* blocked */ }
      var dark = pref === "dark" ||
        (pref !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    })();
  </script>

<div id="app">
  <!-- The plugin rail (docs/13 D5, redrawn): global navigation, one seat per plugin — and
       nothing else. Narrow by design — a plugin is a destination, not a label; the seat shows
       its glyph and the palette (the ⋯ seat) scales to as many plugins as the host can hold.
       App-level controls (memory, theme, focus) live in the context bar's reserved right
       zone, so the rail foot was removed once the theme button moved there. -->
  <aside class="rail" aria-label="Plugins">
    <a class="rail-brand" href="#mcps" title="swiss" aria-label="swiss"><img class="brand-mark" src="/admin/logo.svg" alt=""></a>
    <nav class="rail-nav" id="railNav" aria-label="Plugins">
      <!-- Plugin seats populate this navigation slot at boot; the ⋯ seat opens the palette. -->
    </nav>
    <span class="grow"></span>
  </aside>

  <!-- The plugin context bar (docs/13 D5, as revised): ALWAYS drawn in normal mode —
       every plugin, single-page and workspace included, keeps the same bar height and the
       same body origin. Two zones that never mix: the LEFT belongs to the current page
       (location switcher or static label, then the page's count chip), and the FAR RIGHT
       is a reserved app zone, the same trio on every page in the same order — memory,
       theme, focus. Ordinary Focus keeps a minimal in-flow bar. A workspace may declare
       one shell dock: Terminal hosts this same app-zone in its own toolbar, so its full-page
       mode has one row of chrome and no overlay or empty strip. -->
  <div class="workbench">
    <header class="ctxbar" id="ctxBar" hidden>
      <button class="ctx-switch" id="pageBtn" type="button" aria-haspopup="menu" aria-expanded="false" hidden><!-- Plugin / Page ▾ --></button>
      <span class="ctx-loc" id="pageLoc" hidden><!-- Single-page plugin: the location, as text --></span>
      <span class="grow"></span>
      <span class="chip" id="countChip"></span>
      <span class="chip" id="memChip" title="swiss resident set">mem …</span>
      <span class="app-zone" id="appZone">
        <button class="btn ghost icon" id="themeBtn" title="Appearance" aria-label="Appearance"><svg class="ic" aria-hidden="true"><use href="#i-moon"></use></svg></button>
        <button class="btn ghost icon" id="expandBtn" title="Focus mode — hide app navigation (Esc exits)" aria-label="Focus mode"><svg class="ic" aria-hidden="true"><use href="#i-expand"></use></svg></button>
      </span>
    </header>

      <div class="shell">
      <aside class="sidebar">
        <div class="side-head">
          <input id="filter" type="search" placeholder="Search" aria-label="Filter MCPs">
          <button class="btn icon" id="addBtn" title="New group" aria-label="New group"><svg class="ic" aria-hidden="true"><use href="#i-folder-plus"></use></svg></button>
        </div>
        <div class="side-cap" id="sideCap">MCPs</div>
        <nav class="side-list" id="list" role="listbox" aria-label="Hosted MCPs"></nav>
      </aside>
      <main class="pane" id="pane"></main>
    </div>
  </div>
</div>

<div id="sheet" class="backdrop" hidden></div>
<div id="toast" class="toast" hidden></div>

<script type="module" src="/admin/js/main.js"></script>
</body>
</html>
