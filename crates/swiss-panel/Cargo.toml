[package]
name = "swiss-panel"
version.workspace = true
description = "The swiss admin panel: the embedded TypeScript panel source and its committed emit."
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
swiss-core = { path = "../swiss-core" }
swiss-host = { path = "../swiss-host" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
serde_json = { version = "1", features = ["preserve_order"] }
# The admin panel, embedded and served from &'static [u8]: the raw tree in debug, build.rs's
# gzip of it in release ($OUT_DIR, hence interpolate-folder-path).
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
# Inflates a release asset for the rare client that refuses gzip. reqwest's gzip decoding already
# links this exact build (flate2 default = miniz_oxide), so the direct edge costs no new crate.
flate2 = "1"
# The panel version stamp's digest. russh and sqlx-mysql already build this exact version, so
# the direct edge costs no code.
sha1 = { version = "0.11", default-features = false }

[build-dependencies]
# Gzips the panel tree for release builds (build.rs); the same crate as the runtime edge above.
flate2 = "1"

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "time", "sync", "test-util"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
serde = { version = "1", features = ["derive"] }
