[package]
name = "swiss-plugins"
version.workspace = true
description = "The swiss plugin wrappers: descriptors, routes and adapters that put terminal, remote, process, memory and llm on the host."
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# The composition's wrapper layer (SPEC §arch.crates): the one crate besides the root that names
# several subsystem crates. Each wrapper glues one subsystem to the host's public contracts, and
# memory's adapters read swiss-llm's shared state, so neither of those two names the other. Only
# the root depends on this crate. It used to be the root's src/plugins; as a crate of its own it
# is not rebuilt when only the root's files change.
[dependencies]
swiss-core = { path = "../swiss-core" }
swiss-host = { path = "../swiss-host" }
swiss-mcp = { path = "../swiss-mcp" }
swiss-terminal = { path = "../swiss-terminal" }
swiss-remote = { path = "../swiss-remote" }
swiss-process = { path = "../swiss-process" }
swiss-memory = { path = "../swiss-memory" }
swiss-llm = { path = "../swiss-llm" }
# The rmcp `macros` feature stays off: memory's MCP endpoint implements ServerHandler by hand,
# like swiss-mcp's servers, keeping pastey out of the build.
rmcp = { version = "3.2", default-features = false, features = ["server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
tokio = { version = "1", default-features = false, features = [
    "rt", "macros", "net", "time", "sync", "io-util", "process",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The Test's glob and grep tools; already built with its defaults for genai, so nothing new compiles.
regex = "1"

[dev-dependencies]
# test-utils pins the scratch SWISS_HOME and the deterministic master key for this crate's test
# binary, so no plugin test can read or write the real ~/.swiss.
swiss-core = { path = "../swiss-core", version = "0.1.0", features = ["test-utils"] }
swiss-mcp = { path = "../swiss-mcp", version = "0.1.0", features = ["test-utils"] }
# test-util: the pausable clock the process plugin's autostart retry is asserted with.
tokio = { version = "1", features = ["test-util"] }
# The route tests drive each router with oneshot.
tower = { version = "0.5", default-features = false, features = ["util"] }
# Writes the zstd-framed DSH session a sync test reads (SPEC §memory.sync Conversations); the
# same build swiss-memory decodes them with, so nothing new is compiled.
zstd = { version = "0.13", default-features = false }
