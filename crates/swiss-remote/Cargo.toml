[package]
name = "swiss-remote"
version.workspace = true
description = "The swiss Remote plugin: sealed targets, exec, sync and pull actions, and the audit trail."
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Peer of swiss-mcp/swiss-tunnels: the agent-facing remote-execution plugin. Depends on
# the host contracts ONLY (SPEC §remote) - never on swiss-tunnels: the endpoint is an id
# and a lease through the RemoteTransportRegistry, so this crate builds and tests with
# no SSH client linked at all.
swiss-core = { path = "../swiss-core" }
swiss-host = { path = "../swiss-host" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "sync", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
async-trait = "0.1"
thiserror = "2"
# The module's own history database (SPEC §remote.history, planned): the same sqlx 0.9
# engine family the host store already links, sqlite only.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "json"] }

[dev-dependencies]
# test-utils pins the deterministic master key for this crate's own test binaries.
swiss-core = { path = "../swiss-core", version = "0.2.0", features = ["test-utils"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "sync", "fs", "test-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
# The integration tests drive the real coordinator through the fake transport the
# lib tests use (testing::system_with_fake) — the same test-utils seam swiss-mcp has.
swiss-remote = { path = ".", version = "0.2.0", features = ["test-utils"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
async-trait = "0.1"

[features]
default = []
# Cross-crate/integration test support: the fake transport harness. Never shipped.
test-utils = []
