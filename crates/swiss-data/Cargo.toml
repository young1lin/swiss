[package]
name = "swiss-data"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
swiss-core = { path = "../swiss-core", version = "0.1.0" }
swiss-host = { path = "../swiss-host", version = "0.1.0" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
thiserror = "2"
futures-core = { version = "0.3", default-features = false }
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing"] }

[dev-dependencies]
swiss-core = { path = "../swiss-core", version = "0.1.0", features = ["test-utils"] }
async-trait = "0.1"
tower = { version = "0.5", default-features = false, features = ["util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "time", "sync", "test-util"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
serde = { version = "1", features = ["derive"] }
