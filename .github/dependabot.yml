# Weekly dependency PRs. Cargo updates are grouped so one PR carries the week's patch/minor
# bumps (every manifest change still goes through swiss-dependency-review before merge);
# the panel's npm tree is dev-only tooling; the actions are the CI workflow's pins.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /crates/swiss-panel/panel
    schedule:
      interval: weekly
    groups:
      panel-dev-tooling:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
