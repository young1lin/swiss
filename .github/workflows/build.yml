# Check swiss on every change, build every platform's archive on version tags.
#
# - pull request or push to master: the gate (clippy, the heavy-duplicate check, the tests) on
#   Linux and Windows, clippy on the arm Mac - which catches a call that only compiles against
#   glibc - plus panel, deny and the real-database suite. No release build.
# - v* tag (e.g. v0.1.0) or a manual run: all of that plus the release build of all five targets;
#   a tag also verifies the manifest version and publishes one archive per target plus
#   SHA256SUMS in a GitHub Release.
# - a change under docs/ alone runs nothing.
#
# TLS note (Cargo.toml): Windows builds link schannel, unix builds link rustls — so the unix
# binaries carry no system-OpenSSL dependency. aws-lc-rs (rustls's provider) needs cmake + a C
# compiler on Linux; both are installed below. macOS runners ship Xcode toolchains.

name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    # Not evaluated for tag pushes: a tag always runs everything.
    paths-ignore: ["docs/**"]
  pull_request:
    paths-ignore: ["docs/**"]
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes the run still in flight - its
# result would describe a commit nobody is looking at any more. A tag's run always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Read-only by default; only the release job, which attaches binaries to a GitHub Release,
# is granted write on contents (least privilege for the build/test/deny jobs).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tag-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches Cargo.toml
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["workspace"]["package"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"release tag {tag!r} must match Cargo.toml version v{version}")
          print(f"release tag {tag} matches Cargo.toml")
          PY

  # The gate every change passes, on the runner's own target. macos-latest is the arm Mac.
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A warm run takes ~8 min on the slowest runner (Windows), a cold cache about twice that.
    # The ceiling is for a test that hangs instead of failing, and for a degraded runner (one
    # took 27 min to restore the cache and 65 min in all): GitHub's own default is six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang

      # `--workspace` is load-bearing since the crate split: without it cargo selects the root
      # package alone, and the member crates — most of the code — go unchecked.
      - name: Lint
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings

      # A duplicated TLS stack or async runtime is how a 15 MB target quietly becomes 30 MB.
      # Plain `cargo tree -d` cannot gate this: it exits 0 whatever it finds, and the tree
      # already carries a spread of RustCrypto versions (russh is a generation ahead of our
      # aes-gcm). So print the whole picture, then fail only on the crates whose duplication
      # actually costs megabytes.
      - name: Check for duplicate dependencies
        shell: bash
        run: |
          # -e normal,build: this gate owns the SHIPPING graph. Dev-dependencies - the
          # swiss-it testcontainers harness among them - pull their own copies of hyper
          # and friends into the dev graph; that never reaches the binary, so dev edges
          # must not be able to fail this step (SPEC §testing.it).
          cargo tree -d -e normal,build --locked || true
          # Only the column-0 lines are the duplicated crates themselves; everything indented
          # under them is a parent that merely depends on one, and must not count.
          # `|| true` on the grep alone: the step runs under `-e -o pipefail`, and a clean tree
          # is exactly the case where grep matches nothing and exits 1 - without it the gate
          # failed on success. A failing `cargo tree` still fails the pipeline, as it should.
          heavy=$(cargo tree -d -e normal,build --locked \
            | { grep -E '^(tokio|rustls|native-tls|openssl|openssl-sys|hyper|aws-lc-rs) v' || true; } \
            | sort -u)
          if [ -n "$heavy" ]; then
            echo "::error::a runtime or TLS stack is linked twice:"
            echo "$heavy"
            exit 1
          fi

      # `--workspace` for the same reason as the lint step: the root package holds only a small
      # minority of the suite, and a green run without it would never build the member crates.
      - name: Test
        # Not on macOS yet (README, Install, footnote 1): it has no master-key source, so
        # every sealing test fails there, and a killed local shell's pty never reaches EOF,
        # which hangs the suite. The Mac still lints, which is what catches a call that only
        # compiles against glibc.
        if: runner.os != 'macOS'
        # --no-fail-fast: cargo otherwise stops at the first failing test binary, so a red
        # run names one crate's failures and hides the rest behind it. The step still fails.
        run: cargo test --workspace --locked --no-fail-fast

  # The release archives: every target, only when something will ship them (a tag) or someone
  # asked for them (a manual run). The check job above proves the code; this one only builds.
  dist:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    name: dist ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            exe: swiss.exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            exe: swiss
          # A native arm64 Linux runner, so no cross toolchain is needed.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            exe: swiss
          - target: aarch64-apple-darwin
            os: macos-latest
            exe: swiss
          # Intel macs build as a cross target from the arm runner — Apple clang links both
          # architectures out of the box, no extra toolchain needed.
          - target: x86_64-apple-darwin
            os: macos-latest
            exe: swiss

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-${{ matrix.target }}

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) VERSION="${GITHUB_REF_NAME#v}" ;;
            *) VERSION="dev-${GITHUB_SHA:0:8}" ;;
          esac
          ASSET="swiss-${VERSION}-${{ matrix.target }}"
          mkdir -p dist-stage dist-bin
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" dist-stage/
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md dist-stage/
          mkdir -p dist-stage/skills/swiss dist-stage/skills/swiss-remote
          cp src/skill_assets/SKILL.md dist-stage/skills/swiss/SKILL.md
          cp src/skill_assets/remote/SKILL.md dist-stage/skills/swiss-remote/SKILL.md
          if [ "${{ runner.os }}" = "Windows" ]; then
            pwsh -NoProfile -Command "Compress-Archive -Path 'dist-stage/*' -DestinationPath 'dist-bin/${ASSET}.zip'"
          else
            tar -czf "dist-bin/${ASSET}.tar.gz" -C dist-stage .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist-bin/*
          if-no-files-found: error

  # The panel's own gate (SPEC §panel.toolchain): the Rust jobs above do not need node —
  # the committed emit is what ships — so the TypeScript side is proved here, standalone,
  # on the platform npm is fastest on. Kept independent: no Rust job depends on it and it
  # depends on none of them.
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/swiss-panel/panel/package-lock.json
      - name: npm ci
        run: npm ci
        working-directory: crates/swiss-panel/panel
      - name: npm run check
        run: npm run check
        working-directory: crates/swiss-panel/panel

  # Licenses, advisories and registry sources against deny.toml (SPEC §release.ci). Independent of
  # the Rust jobs like the panel job: one cheap ubuntu run, no Rust build.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --locked

  # Gate 2 (SPEC §testing.it): the real-database suite - testcontainers raises MySQL/PG/
  # Redis through the runner's own dockerd, so the adapters, the browsers and the L2/L3
  # gateway/proc paths are proven on real engines before any tag ships. Ubuntu only:
  # docker is preinstalled there and the SQL wire is not platform-shaped; mac and
  # Windows runners skip it (the local Windows machine runs the same gate on deploys).
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: integration
      - run: sudo apt-get update && sudo apt-get install -y cmake clang
      - run: cargo test -p swiss-it --features it --locked
      # A red suite is half-diagnosed already when the container state and the engine
      # log travel with the failure: leftover containers name the leak, the mysql log
      # tail names the startup that never finished.
      - if: failure()
        run: docker ps -a && docker logs $(docker ps -aq --filter ancestor=mysql:8.4) 2>&1 | tail -50

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tag-version, check, dist, panel, deny, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist-bin
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: |
          cd dist-bin
          sha256sum swiss-*.zip swiss-*.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist-bin/*
          generate_release_notes: true
