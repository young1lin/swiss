# Link with rust-lld (the lld-link driver shipped with the toolchain) instead of MSVC
# link.exe. Same inputs, same binaries, less wall time. Measured back-to-back on a
# quiet box: cargo test --workspace from cold 259 s with link.exe vs 185 s with
# rust-lld (-28%); a release crate-touch relink 161 s vs 137 s (compile-dominated).
# Costs one full fingerprint invalidation the first build after switching.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
