<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swiss Panel Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400..700&display=swap">
<style>
/* ============ page chrome (the frame around the prototype) ============ */
:root {
  --pg-bg: #f1f1f3; --pg-card: #ffffff; --pg-ink: #17171a; --pg-ink2: #5d5f66; --pg-ink3: #8b8d94;
  --pg-line: rgba(0, 0, 0, .09); --pg-accent: #da291c; --pg-accent-soft: rgba(218, 41, 28, .07); --pg-warn: #b45309;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --pg-bg: #0b0b0d; --pg-card: #151518; --pg-ink: #ececee; --pg-ink2: #a0a2a8; --pg-ink3: #6d6f76;
    --pg-line: rgba(255, 255, 255, .09); --pg-accent: #f0503f; --pg-accent-soft: rgba(240, 80, 63, .10); --pg-warn: #f59e0b;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--pg-bg); color: var(--pg-ink);
  font: 14px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
}
kbd { font: 600 11px/1 "JetBrains Mono", Consolas, monospace; padding: 2px 5px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--pg-line), 0 1px 0 var(--pg-line); background: var(--pg-card); }
.layout { display: grid; gap: 20px; padding-block: 20px 48px; padding-inline: 20px; max-width: 1960px; margin: 0 auto; }
@media (min-width: 1280px) {
  .layout { grid-template-columns: 284px minmax(0, 1fr); align-items: start; }
  .ctl { position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow: auto; padding-right: 2px; }
}
.ctl { display: grid; gap: 20px; align-content: start; }
.ctl-head { display: grid; gap: 6px; }
.brandline { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--pg-ink3); }
.brandline svg { width: 18px; height: 18px; }
.ctl-head h1 { font-size: 18px; line-height: 1.3; font-weight: 650; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.ctl-head p { margin: 0; color: var(--pg-ink2); font-size: 13px; }
.sect-lbl { font-size: 11px; color: var(--pg-ink3); letter-spacing: .06em; text-transform: uppercase; margin: 0 0 8px; }
.presets { display: grid; gap: 8px; }
.preset {
  all: unset; box-sizing: border-box; display: grid; gap: 3px; padding: 10px 12px; border-radius: 10px;
  background: var(--pg-card); box-shadow: 0 0 0 1px var(--pg-line); cursor: pointer;
}
.preset:hover { box-shadow: 0 0 0 1px color-mix(in srgb, var(--pg-ink) 28%, transparent); }
.preset[aria-checked="true"] { box-shadow: 0 0 0 1.5px var(--pg-accent); background: color-mix(in srgb, var(--pg-accent) 4%, var(--pg-card)); }
.preset:focus-visible, .kseg button:focus-visible, .hold:focus-visible { outline: 2px solid var(--pg-accent); outline-offset: 2px; }
.p-top { display: flex; align-items: center; gap: 8px; }
.p-key { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: color-mix(in srgb, var(--pg-ink) 8%, transparent); color: var(--pg-ink2); flex: none; }
.preset[aria-checked="true"] .p-key { background: var(--pg-accent); color: #fff; }
.p-name { font-weight: 600; font-size: 14px; }
.p-tag { margin-left: auto; font-size: 11px; padding: 1px 6px; border-radius: 4px; color: var(--pg-accent); background: var(--pg-accent-soft); white-space: nowrap; }
.p-tag.warn { color: var(--pg-warn); background: color-mix(in srgb, var(--pg-warn) 12%, transparent); }
.p-sum { font-size: 12.5px; color: var(--pg-ink2); line-height: 1.5; }
.p-meta { font-size: 11.5px; color: var(--pg-ink3); }
.custom { font-size: 12px; color: var(--pg-ink3); min-height: 18px; }
.knobs { display: grid; gap: 6px; }
.knob { display: grid; grid-template-columns: 52px minmax(0, 1fr); align-items: center; gap: 8px; }
.knob-lbl { font-size: 12.5px; color: var(--pg-ink2); }
.kseg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 2px; border-radius: 8px; background: color-mix(in srgb, var(--pg-ink) 6%, transparent); }
.kseg button { all: unset; box-sizing: border-box; text-align: center; font-size: 12.5px; padding: 4px 6px; border-radius: 6px; color: var(--pg-ink2); cursor: pointer; white-space: nowrap; }
.kseg button:hover { color: var(--pg-ink); }
.kseg button[aria-pressed="true"] { background: var(--pg-card); color: var(--pg-ink); box-shadow: 0 0 0 1px var(--pg-line); font-weight: 600; }
.kseg button.changed[aria-pressed="true"]::after { content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--pg-accent); margin-left: 6px; vertical-align: 2px; }
.hold {
  all: unset; box-sizing: border-box; display: flex; width: 100%; align-items: center; justify-content: center; gap: 8px;
  padding: 9px 12px; border-radius: 10px; background: var(--pg-card); box-shadow: 0 0 0 1px var(--pg-line);
  cursor: pointer; font-size: 13px; font-weight: 600; user-select: none; -webkit-user-select: none;
}
.hold.on { background: var(--pg-ink); color: var(--pg-bg); }
.hold-hint { font-size: 12px; color: var(--pg-ink3); margin-top: 6px; }

.main { display: grid; gap: 24px; min-width: 0; }
.stage { position: relative; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--pg-line), 0 16px 48px rgba(0, 0, 0, .14); }
.stage-scroll { overflow-x: auto; }
.hold-badge {
  position: absolute; top: 50px; left: 50%; transform: translateX(-50%); z-index: 40;
  padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
  background: var(--pg-accent); color: #fff; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); white-space: nowrap;
}
.notes { display: grid; gap: 12px; }
.notes-head h2 { font-size: 16px; margin: 0; font-weight: 650; }
.notes-head p { margin: 4px 0 0; color: var(--pg-ink2); font-size: 13.5px; max-width: 72ch; }
.note-list { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
.note { background: var(--pg-card); border-radius: 10px; box-shadow: 0 0 0 1px var(--pg-line); padding: 14px 16px; display: grid; gap: 6px; align-content: start; }
.note h3 { margin: 0; font-size: 14px; font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.note .cost { font-size: 11px; font-weight: 500; color: var(--pg-ink2); background: color-mix(in srgb, var(--pg-ink) 7%, transparent); padding: 1px 6px; border-radius: 4px; }
.note .flag { font-size: 11px; font-weight: 500; color: var(--pg-warn); background: color-mix(in srgb, var(--pg-warn) 12%, transparent); padding: 1px 6px; border-radius: 4px; }
.note p { margin: 0; font-size: 13px; color: var(--pg-ink2); line-height: 1.65; }
.note .where { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11.5px; color: var(--pg-ink3); line-height: 1.5; }
.still { font-size: 12.5px; color: var(--pg-ink3); }
.foot { font-size: 12px; color: var(--pg-ink3); }

/* ============ the prototype: Swiss panel, tokens copied from styles/base.css ============ */
.mock {
  --f-title: 22px; --f-head: 15px; --f-body: 13px; --f-label: 12px; --f-caption: 11px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px;
  --measure-wide: 1180px; --r-card: 8px; --r-row: 6px; --r-btn: 6px;
  --bg: #fafafa; --sidebar: #f4f4f5; --bar: #ffffff; --card: #ffffff; --field: #ffffff; --chrome: #ececef;
  --text: #111114; --text-2: #6b7280; --text-3: #9ca3af;
  --sep: rgba(0, 0, 0, .08); --sep-soft: rgba(0, 0, 0, .05); --hover: rgba(0, 0, 0, .04);
  --accent: #2563eb; --accent-text: #fff; --green: #16a34a; --red: #dc2626; --amber: #d97706;
  --syn-key: #0550ae; --syn-str: #116329; --syn-num: #953800; --syn-lit: #8250df; --syn-punct: #6e7781;
  --shadow-card: 0 0 0 1px var(--sep);
  --shadow-pop: 0 8px 24px rgba(20, 24, 36, .14), 0 0 0 1px var(--sep);
  /* weights as they are hard-coded today */
  --w-name: 500; --w-sel: 600; --w-grp: 600; --w-ui: 500; --w-tab: 600; --w-code: 550; --w-cap: 600;
  /* what this machine actually renders: Inter is named first in base.css but is not installed */
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei UI", sans-serif;
  --mono: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
  color-scheme: light;
  position: relative; display: flex; min-width: 1100px;
  height: clamp(560px, calc(100vh - 40px), 900px);
  overflow: hidden; background: var(--bg); color: var(--text);
  font-family: var(--sans); font-size: var(--f-body); line-height: 1.45;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; font-optical-sizing: auto;
}
.mock[data-mtheme="dark"] {
  color-scheme: dark;
  --bg: #0f1012; --sidebar: #141518; --bar: #141518; --card: #191a1e; --field: #0f1012; --chrome: #09090b;
  --text: #ededef; --text-2: #9a9ca3; --text-3: #66686f;
  --sep: rgba(255, 255, 255, .08); --sep-soft: rgba(255, 255, 255, .05); --hover: rgba(255, 255, 255, .05);
  --accent: #3b82f6; --green: #4ade80; --red: #f87171; --amber: #fbbf24;
  --syn-key: #79c0ff; --syn-str: #a5d6ff; --syn-num: #ffa657; --syn-lit: #d2a8ff; --syn-punct: #8b949e;
  --shadow-card: 0 0 0 1px var(--sep), inset 0 1px 0 rgba(255, 255, 255, .04);
  --shadow-pop: 0 8px 24px rgba(0, 0, 0, .5), 0 0 0 1px var(--sep);
}
.mock[data-font="inter"] {
  --sans: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei UI", sans-serif;
  font-feature-settings: "cv11", "ss01";
}
.mock[data-weight="light"] { --w-name: 400; --w-sel: 500; --w-grp: 500; --w-ui: 400; --w-tab: 500; --w-code: 450; --w-cap: 500; }
.mock[data-weight="light"][data-mtheme="dark"] { --text: #e4e4e7; }

:where(.mock) button, :where(.mock) input { font: inherit; color: inherit; }
:where(.mock) button { background: none; border: 0; padding: 0; cursor: pointer; }
:where(.mock) .ic { width: 16px; height: 16px; flex: none; }
.mock :focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 1px; border-radius: 6px; }
.mock h2, .mock h3 { margin: 0; }

/* scrollbars: native (today) vs styled */
.mock[data-sb="thin"] ::-webkit-scrollbar { width: 10px; height: 10px; }
.mock[data-sb="thin"] ::-webkit-scrollbar-track { background: transparent; }
.mock[data-sb="thin"] ::-webkit-scrollbar-button { display: none; }
.mock[data-sb="thin"] ::-webkit-scrollbar-thumb { background-color: color-mix(in srgb, var(--text) 16%, transparent); border: 3px solid transparent; background-clip: padding-box; border-radius: 10px; }
.mock[data-sb="thin"] ::-webkit-scrollbar-thumb:hover { background-color: color-mix(in srgb, var(--text) 32%, transparent); }
@supports not selector(::-webkit-scrollbar) {
  .mock[data-sb="thin"] * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--text) 22%, transparent) transparent; }
}

/* rail */
.m-rail { width: 56px; flex: none; display: flex; flex-direction: column; background: var(--sidebar); border-right: 1px solid var(--sep); padding: var(--s2) 0; }
.m-brand { display: flex; justify-content: center; padding: var(--s1) 0 var(--s2); }
.m-brand svg { width: 20px; height: 20px; }
.m-rail-nav { display: flex; flex-direction: column; gap: 2px; padding: 0 var(--s1); }
.m-seat { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 42px; border-radius: var(--r-btn); padding: 0 var(--s1); color: var(--text-2); }
.m-seat .ic { width: 18px; height: 18px; }
.m-seat span { font-size: 10px; line-height: 1.15; letter-spacing: .01em; }
.m-seat:hover { background: var(--hover); color: var(--text); }
.m-seat[aria-current="true"] { background: var(--hover); color: var(--text); box-shadow: inset 2px 0 0 var(--accent); }

/* workbench + context bar */
.m-work { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.m-ctx { display: flex; align-items: center; gap: var(--s2); height: 40px; flex: none; padding: 0 var(--s4); background: var(--bar); border-bottom: 1px solid var(--sep); }
.m-ctx-title { display: inline-flex; align-items: center; gap: var(--s2); font-weight: 600; margin-right: var(--s3); }
.m-ctx-title .ic { color: var(--text-2); }
.m-tabs { display: flex; align-self: stretch; gap: 2px; }
.m-tab { position: relative; display: inline-flex; align-items: center; padding: 0 var(--s2); color: var(--text-2); font-weight: var(--w-ui); white-space: nowrap; }
.m-tab:hover { color: var(--text); }
.m-tab[aria-current="page"] { color: var(--text); font-weight: var(--w-tab); }
.m-tab[aria-current="page"]::after { content: ""; position: absolute; left: var(--s2); right: var(--s2); bottom: -1px; height: 2px; background: var(--accent); border-radius: 1px 1px 0 0; }
.m-grow { flex: 1; }
.m-readout { font-size: var(--f-label); color: var(--text-3); white-space: nowrap; }
.m-readsep { color: var(--text-3); margin: 0 2px; }
.m-mem { font-family: var(--mono); font-size: var(--f-caption); color: var(--text-3); }
.m-appzone { display: inline-flex; gap: var(--s2); margin-left: var(--s2); }
.m-ib { width: 32px; height: 28px; display: inline-grid; place-items: center; border-radius: var(--r-btn); color: var(--text-2); flex: none; }
.m-ib:hover { background: var(--hover); color: var(--text); }
.m-ib.sm { width: 26px; height: 22px; }
.m-ib.sm .ic { width: 13px; height: 13px; }

/* shell + sidebar */
.m-shell { display: flex; flex: 1; min-height: 0; }
.m-side { width: 248px; flex: none; display: flex; flex-direction: column; background: var(--sidebar); border-right: 1px solid var(--sep); }
.m-side-head { display: flex; gap: var(--s1); padding: var(--s3) var(--s2) var(--s1); }
.m-input { width: 100%; min-width: 0; padding: 5px 10px; border-radius: var(--r-row); border: 1px solid var(--sep); background: var(--field); font-size: var(--f-body); outline: none; }
.m-input::placeholder { color: var(--text-3); }
.m-input:focus { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
.m-side-list { flex: 1; overflow-y: auto; padding: var(--s1) var(--s2) var(--s4); }
.m-grp + .m-grp { margin-top: var(--s2); }
.m-band { display: flex; align-items: center; gap: var(--s2); height: 28px; padding: 0 var(--s2); background: var(--sep-soft); border-radius: var(--r-row); }
.m-band:hover { background: var(--sep); }
.m-gtoggle { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--s2); text-align: left; font-weight: var(--w-grp); height: 100%; }
.m-gchev { width: 12px; height: 12px; color: var(--text-3); transition: transform .15s ease; flex: none; }
.m-grp:not(.collapsed) .m-gchev { transform: rotate(90deg); }
.m-gname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m-gn { font-size: var(--f-caption); font-weight: 500; color: var(--text-3); }
.m-gadd, .m-gmore { width: 24px; height: 20px; display: grid; place-items: center; border-radius: 4px; color: var(--text-3); }
.m-gadd .ic, .m-gmore .ic { width: 13px; height: 13px; }
.m-gadd { opacity: .55; }
.m-gmore { opacity: 0; }
.m-band:hover .m-gadd, .m-band:hover .m-gmore, .m-gadd:focus-visible, .m-gmore:focus-visible { opacity: 1; }
.m-gadd:hover, .m-gmore:hover { color: var(--text); background: var(--card); }
.m-grp.collapsed .m-gbody { display: none; }
.m-gbody { padding: var(--s1) 0 0 var(--s4); }
.m-gempty { height: 28px; display: flex; align-items: center; padding: 0 var(--s2); font-size: var(--f-caption); color: var(--text-3); }
.m-srow { display: flex; align-items: center; gap: var(--s2); width: 100%; height: 30px; padding: 0 var(--s2); border-radius: var(--r-row); text-align: left; }
.m-srow:hover { background: var(--hover); }
.m-srow[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 8%, transparent); box-shadow: inset 2px 0 0 var(--accent); }
.m-sname { flex: 1; min-width: 0; font-weight: var(--w-name); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m-srow[aria-selected="true"] .m-sname { font-weight: var(--w-sel); }
.m-glyph { color: var(--text-3); display: grid; }
.m-glyph .ic { width: 14px; height: 14px; }
.m-srow:hover .m-glyph, .m-srow[aria-selected="true"] .m-glyph { color: var(--text-2); }
.m-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--text-3); }
.m-dot.up { background: var(--green); }
.m-dot.down { background: var(--red); }
.m-dot.idle { background: transparent; box-shadow: inset 0 0 0 1.5px var(--text-3); }

/* detail pane: header + L3 segments + body */
.m-detail { flex: 1; min-width: 0; position: relative; background: var(--bg); }
.mock[data-head="scroll"] .m-detail { overflow-y: auto; }
.mock[data-head="fixed"] .m-detail { display: flex; flex-direction: column; overflow: hidden; }
.mock[data-head="fixed"] .m-dbody { flex: 1; min-height: 0; overflow-y: auto; padding-top: var(--s1); }
.m-dhead { padding: var(--s5) var(--s8) 0; }
.m-dbody { padding: 0 var(--s8) var(--s8); }
.m-dhead > *, .m-dbody > * { max-width: var(--measure-wide); }
.mock[data-head="fixed"] .m-dhead { flex: none; position: relative; z-index: 2; background: var(--bg); }
.mock[data-head="fixed"] .m-seg { margin-bottom: var(--s3); }
.mock[data-head="fixed"] .m-detail.scrolled .m-dhead { box-shadow: 0 1px 0 var(--sep); }
.mock[data-head="fixed"] .m-detail.scrolled .m-pane-desc,
.mock[data-head="fixed"] .m-detail.scrolled .m-pane-sub { display: none; }
.mock[data-head="fixed"] .m-detail.scrolled .m-pane-title { font-size: var(--f-head); }
.mock[data-head="fixed"] .m-detail.scrolled .m-pane-head { margin-bottom: var(--s3); align-items: center; }
.m-pane-head { display: flex; align-items: flex-start; gap: var(--s4); margin-bottom: var(--s5); }
.m-ph-main { min-width: 0; }
.m-pane-title { font-size: var(--f-title); font-weight: 600; letter-spacing: -.02em; line-height: 1.25; }
.m-pane-desc { color: var(--text-2); margin-top: var(--s1); max-width: 68ch; line-height: 1.5; }
.m-pane-sub { display: flex; align-items: center; gap: var(--s2); font-size: var(--f-label); color: var(--text-2); margin-top: var(--s2); }
.m-sub-path { font-family: var(--mono); font-size: var(--f-caption); }
.m-sep { color: var(--text-3); }
.m-pane-actions { margin-left: auto; display: flex; gap: var(--s2); }
.m-btn { font-size: var(--f-body); font-weight: 500; line-height: 20px; padding: 4px var(--s3); border-radius: var(--r-btn); background: var(--card); box-shadow: inset 0 0 0 1px var(--sep); white-space: nowrap; }
.m-btn:hover { background: color-mix(in srgb, var(--hover), var(--card)); }
.m-btn.primary { background: var(--accent); color: var(--accent-text); box-shadow: none; }
.m-btn.m-btn-ic { padding: 4px var(--s2); display: inline-grid; place-items: center; }
.m-seg { display: inline-flex; gap: 2px; padding: 3px; margin-bottom: var(--s4); background: var(--sep-soft); border-radius: 8px; }
.m-seg button { font-weight: var(--w-ui); color: var(--text-2); padding: 3px var(--s3); border-radius: 6px; }
.m-seg button:hover { color: var(--text); }
.m-seg button[aria-selected="true"] { background: var(--card); color: var(--text); font-weight: var(--w-tab); box-shadow: 0 0 0 1px var(--sep); }
.mock[data-mtheme="dark"] .m-seg button[aria-selected="true"] { background: color-mix(in srgb, var(--card), white 7%); box-shadow: inset 0 0 0 1px var(--sep); }
.m-seg-n { font-size: var(--f-caption); color: var(--text-3); margin-left: 5px; }

/* cards, tools */
.m-card, .m-calls { background: var(--card); box-shadow: var(--shadow-card); border-radius: var(--r-card); overflow: clip; }
.m-trow { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); }
.m-trow + .m-trow { border-top: 1px solid var(--sep-soft); }
.m-tmain { flex: 1; min-width: 0; display: grid; gap: 2px; }
.m-tname { font-family: var(--mono); font-size: var(--f-label); font-weight: var(--w-code); }
.m-tdesc { font-size: var(--f-label); color: var(--text-2); }
.m-sw { width: 38px; height: 22px; border-radius: 999px; position: relative; flex: none; background: var(--sep); box-shadow: inset 0 0 0 1px var(--sep-soft); transition: background .15s ease; }

/* empty state (util.ts emptyNode) */

/* Logs: shared */
.m-sec-head { display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s1) var(--s2); min-height: 36px; }
.m-sec-cap { font-size: var(--f-caption); font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); }
.m-sec-n { font-size: var(--f-caption); color: var(--text-3); margin-left: calc(var(--s2) * -1); }
.m-sec-head .m-q { margin-left: auto; flex: 1 1 180px; max-width: 260px; padding: 3px var(--s2); font-size: var(--f-caption); }
.m-call + .m-call { border-top: 1px solid var(--sep-soft); }
.m-call-sum { display: flex; align-items: center; gap: var(--s2); width: 100%; text-align: left; padding: var(--s2) var(--s4); }

.m-chev { width: 12px; height: 12px; color: var(--text-3); flex: none; transition: transform .15s ease; }
.m-call.open .m-chev { transform: rotate(90deg); }
.m-tool { font-family: var(--mono); font-weight: var(--w-code); font-size: var(--f-label); white-space: nowrap; }
.m-arg { flex: 1; min-width: 0; font-family: var(--mono); font-size: var(--f-caption); color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m-meta { font-size: var(--f-caption); color: var(--text-3); white-space: pre; }
.m-call-body { display: none; padding: 0 var(--s4) var(--s3); }
.m-call.open .m-call-body { display: block; }
.m-lbl { font-size: var(--f-caption); font-weight: var(--w-cap); text-transform: uppercase; letter-spacing: .04em; color: var(--text-3); padding: var(--s2) 0 var(--s1); display: flex; align-items: center; gap: var(--s2); }
.m-acts { margin-left: auto; display: inline-flex; gap: var(--s1); }
.m-tbtn { display: inline-flex; align-items: center; gap: var(--s1); padding: 0 var(--s2); font-size: var(--f-caption); font-weight: 500; line-height: 24px; text-transform: none; letter-spacing: 0; color: var(--text-3); border-radius: 6px; }
.m-tbtn:hover { color: var(--text); background: var(--hover); }
.m-tbtn .ic { width: 12px; height: 12px; }
pre.m-jv { margin: 0; padding: var(--s2) var(--s3); background: var(--sep-soft); border-radius: var(--r-row); font-family: var(--mono); font-size: var(--f-label); line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 2; }

.jk { color: var(--syn-key); } .js { color: var(--syn-str); } .jn { color: var(--syn-num); } .jl { color: var(--syn-lit); } .jp { color: var(--syn-punct); }
.m-noresult { padding: var(--s4); color: var(--text-3); font-size: var(--f-label); }

/* Logs: the re-laid version */
.mock[data-info="new"] .m-call-sum { display: grid; grid-template-columns: 12px 58px 6px max-content minmax(0, 1fr) auto 62px; column-gap: 10px; padding: 7px var(--s3); }
.m-time { font-size: var(--f-label); color: var(--text-3); }
.m-rep { font-size: var(--f-caption); color: var(--text-2); background: var(--sep-soft); padding: 0 6px; border-radius: 4px; line-height: 18px; }

.m-ms { text-align: right; font-size: var(--f-label); color: var(--text-2); }
.m-ms.slow { color: var(--amber); }
.m-day { position: sticky; top: 0; z-index: 1; background: var(--card); font-size: var(--f-caption); font-weight: 500; color: var(--text-3); padding: 10px var(--s3) 4px 34px; }

.m-callmeta { font-size: var(--f-caption); color: var(--text-3); padding-top: 2px; }

/* fewer lines */

/* inset canvas */

/* focus mode */

/* toast + popup menu */

@media (prefers-reduced-motion: reduce) {
  .m-gchev, .m-chev, .m-sw, .m-sw::after { transition: none; }
}

/* ============ other plugin pages ============ */
.mock { --w-row: 500; }

/* content pane (Content template) */

/* Terminal workspace */

  flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg);
  --t-bg: #2b2b2b; --t-bar: #232323; --t-edge: #3d3d3d; --t-fg: #d2d2d2; --t-dim: #8f8f8f;

}

      + '<div class="m-dbfoot">' + TABLES.length + " in total</div></aside>";
    const head = '<div class="m-dbhead"><div><div class="m-dbtitle">shop.' + t + '</div><div class="m-dbmeta">' + rowsN + " rows · editable — changes buffer until Commit</div></div>"
      + '<div class="m-dbctl"><div class="m-seg" role="tablist">' + ["Data", "Form", "Structure", "DDL"].map((v) => '<button role="tab" data-act="noop" data-v="' + v + ' view" aria-selected="' + (v === "Data") + '">' + v + "</button>").join("") + "</div>"
      + btn("+ Row") + (n ? moreBtn("data") : '<button class="m-btn m-btn-ic" data-act="menu" data-menu="data" title="More" aria-label="More">' + icon("ellipsis") + "</button>") + "</div></div>";
    const th = '<tr><th class="ctl"><input type="checkbox" aria-label="Select all"></th>' + COLS.map(([c, ty, cm, , pk]) => '<th><div class="m-colmain"><span>' + c + "</span>" + (pk ? icon("key") : "") + '<span class="m-coltype">' + ty + '</span></div><div class="m-colcmt">' + esc(cm) + "</div></th>").join("") + "</tr>";
    const tb = GRID.map((r) => '<tr><td class="ctl"><input type="checkbox" data-rowchk aria-label="Select row"><button class="m-rowdel" data-act="noop" data-v="Delete row" title="Delete row" aria-label="Delete row">' + icon("x") + "</button></td>"
      + r.map((v, i) => v === null ? '<td class="null">NULL</td>' : '<td' + (COLS[i][3] ? ' class="num"' : "") + ">" + esc(v) + "</td>").join("") + "</tr>").join("");
    const status = '<div class="m-dbstatus">' + dd("50") + "<span>1–50 of " + rowsN + "</span>" + '<button class="m-ib" data-act="noop" data-v="Previous page" aria-label="Previous page">' + icon("chevron-left") + '</button><button class="m-ib" data-act="noop" data-v="Next page" aria-label="Next page">' + icon("chevron-right") + "</button>"
      + (n ? "" : "<span>editable — changes buffer until Commit</span>") + '<span class="m-grow"></span><span>shop @ 127.0.0.1:3306</span></div>';
    const main = '<div class="m-dbmain"><div class="m-dbstrip"><span class="m-dbtab sel">' + icon("table") + "<span>" + t + '</span><span class="m-dbtab-x" data-act="noop" data-v="Close tab">' + icon("x") + "</span></span>"
      + '<button class="m-dbadd" data-act="noop" data-v="Open tabs" aria-label="Open tabs">' + icon("chevron-down") + '</button><button class="m-dbadd" data-act="noop" data-v="New SQL console">' + icon("plus") + "SQL</button></div>"
      + head + '<div class="m-dbfilter">' + btn("+ Filter") + "</div>"
      + '<div class="m-gridwrap"><table class="m-grid"><thead>' + th + "</thead><tbody>" + tb + "</tbody></table></div>" + status + "</div>";
    return '<div class="m-db">' + side + main + "</div>";
  }

  /* ================= Terminal workspace ================= */
  function termHtml() {
    const tabs = ["pwsh · local", "bash · staging"].map((t, i) => '<button class="m-ttab" data-act="term" data-v="' + i + '" aria-selected="' + (state.term === i) + '">' + t + '<span class="x" aria-hidden="true">✕</span></button>').join("");
    return '<div class="m-term"><div class="m-tbar"><div class="m-ttabs" role="tablist">' + tabs + "</div>"
      + '<div class="m-tslot"><span class="m-tpick">local · PowerShell 7' + icon("chevron-down") + "</span>"
      + '<button class="m-tib" data-act="noop" data-v="Terminal settings" title="Terminal settings" aria-label="Terminal settings">' + icon("gear") + "</button>"
      + '<button class="m-topen" data-act="noop" data-v="Open session">Open session</button>'
      + '<button class="m-tib" data-act="noop" data-v="Shortcuts" title="Shortcuts" aria-label="Shortcuts">' + icon("help") + "</button></div></div>"
      + '<div class="m-tstage"><pre class="m-tout">' + TERM[state.term] + "</pre></div></div>";
  }

  /* ================= render + apply ================= */
  function renderChrome() {
    const p = pluginOf(state.page);
    $("#mRail").innerHTML = PLUGINS.map((pl) => '<button class="m-seat" data-act="seat" data-v="' + pl.id + '" title="' + pl.id + '"' + (pl === p ? ' aria-current="true"' : "") + ">" + icon(pl.icon) + "<span>" + pl.id + "</span></button>").join("")
      + '<button class="m-seat" data-act="noop" data-v="All plugins" title="All plugins" aria-label="All plugins">' + icon("ellipsis") + "</button>";
    $("#mCtxIc").setAttribute("href", "#i-" + p.icon);
    $("#mCtxName").textContent = p.id;
    $("#mTabs").innerHTML = p.pages.length > 1 ? p.pages.map(([id, label]) => '<button class="m-tab" data-act="page" data-v="' + id + '"' + (id === state.page ? ' aria-current="page"' : "") + ">" + label + "</button>").join("") : "";
    const c = COUNT[state.page]; $("#mCount").textContent = c; $("#mCountSep").hidden = !c;
  }
  function renderPage() {
    const sh = $("#mShell"), pg = state.page;
    if (pg === "servers") { sh.innerHTML = serversShell(); renderSide(); renderHead(); renderBody(); }
    else if (pg === "data") sh.innerHTML = dataHtml();
    else if (pg === "terminal") sh.innerHTML = termHtml();
    else sh.innerHTML = '<main class="m-pane" id="mPane"><div class="m-page">' + PAGES[pg]() + "</div></main>";
    state.rendered = pg;
  }
  function rerenderPane() {
    const m = document.querySelector("#mPane .m-page");
    if (m) m.innerHTML = PAGES[state.page](); else renderPage();
  }
  function scroller() {
    if (state.rendered === "servers") return state.k && state.k.head === "fixed" ? $("#mBody") : $("#mDetail");
    if (state.rendered === "data") return document.querySelector(".m-gridwrap");
    if (state.rendered === "terminal") return document.querySelector(".m-tstage");
    return $("#mPane");
  }
  function nudgeScrollbars() {
    // Chromium does not always repaint ::-webkit-scrollbar rules that change at runtime.
    for (const el of mock.querySelectorAll("#mSide, #mDetail, #mBody, #mPane, .m-gridwrap, .m-dbtables, .m-tstage")) {
      const prev = el.style.overflowY; el.style.overflowY = "hidden"; void el.offsetHeight; el.style.overflowY = prev;
    }
  }
  function settleScroll() {
    const det = $("#mDetail"), body = $("#mBody");
    if (!det) return;
    det.classList.remove("scrolled"); body.scrollTop = 0;
    if (state.k.head === "scroll") {
      // The owner's screenshot: scrolled just far enough that the L3 segments are clipped.
      const seg = $("#mSeg"); det.scrollTop = seg ? seg.offsetTop + 5 : 0;
    } else det.scrollTop = 0;
  }
  function apply(k, transient) {
    const prevHead = state.k ? state.k.head : null, sc = scroller(), keep = sc ? sc.scrollTop : 0;
    state.k = { ...k };
    const d = mock.dataset;
    d.mtheme = k.theme; d.font = k.font; d.weight = k.weight; d.lines = k.lines; d.sb = k.sb; d.head = k.head; d.info = k.info; d.canvas = k.canvas;
    $("#mThemeIc").setAttribute("href", k.theme === "dark" ? "#i-sun" : "#i-moon");
    renderControls();
    if (!transient) { renderNotes(); save(); }
    renderPage();
    nudgeScrollbars();
    if (state.page === "servers" && (state.first || prevHead !== k.head)) settleScroll();
    else { const s2 = scroller(); if (s2) s2.scrollTop = keep; }
    state.first = false;
  }
  function save() { try { localStorage.setItem("swiss-directions-2", JSON.stringify({ k: state.k, page: state.page })); } catch (e) { /* storage blocked */ } }
  function go(page) {
    closeMenu();
    state.page = page; state.lastPage[pluginOf(page).id] = page;
    renderChrome(); renderPage(); nudgeScrollbars(); renderNotes(); save();
  }
  function setKnob(key, v) { if (held) return; apply({ ...state.k, [key]: v }); }
  function select(id) {
    if (!SERVERS[id]) return;
    state.sel = id; state.q = "";
    renderSide(); renderHead(); renderBody();
    const det = $("#mDetail"); det.scrollTop = 0; $("#mBody").scrollTop = 0; det.classList.remove("scrolled");
  }
  function toggleFocus(force) {
    const on = force === undefined ? !mock.classList.contains("immersive") : force;
    mock.classList.toggle("immersive", on);
    $("#mFocusIc").setAttribute("href", on ? "#i-collapse" : "#i-expand");
  }

  /* ================= controls + notes ================= */
  const matchPreset = (k) => Object.keys(PRESETS).find((p) => Object.keys(PRESETS[p]).every((key) => PRESETS[p][key] === k[key])) || null;
  function renderControls() {
    const k = state.k, pid = matchPreset(k);
    $("#presets").innerHTML = Object.keys(PRESET_META).map((p) => {
      const m = PRESET_META[p];
      return '<button class="preset" role="radio" data-preset="' + p + '" aria-checked="' + (pid === p) + '">'
        + '<span class="p-top"><span class="p-key">' + m.key + '</span><span class="p-name">' + m.name + "</span>"
        + (m.tag ? '<span class="p-tag' + (m.warn ? " warn" : "") + '">' + m.tag + "</span>" : "") + "</span>"
        + '<span class="p-sum">' + m.sum + '</span><span class="p-meta">' + m.meta + "</span></button>";
    }).join("");
    $("#customNote").textContent = pid ? "" : "当前是自定义组合，不对应任何一个方向。";
    $("#knobs").innerHTML = KNOBS.map(([key, label, opts]) => '<div class="knob"><span class="knob-lbl">' + label + '</span><div class="kseg" role="group" aria-label="' + label + '">'
      + opts.map(([v, t]) => '<button type="button" data-knob="' + key + '" data-v="' + v + '" aria-pressed="' + (k[key] === v) + '"'
        + (key !== "theme" && PRESETS.asis[key] !== v ? ' class="changed"' : "") + ">" + t + "</button>").join("") + "</div></div>").join("");
  }
  const noteCard = (n) => '<div class="note"><h3>' + n.t + '<span class="cost">' + n.cost + "</span>" + (n.flag ? '<span class="flag">' + n.flag + "</span>" : "") + "</h3><p>" + esc(n.d) + '</p><div class="where">' + esc(n.w) + "</div></div>";
  function renderNotes() {
    const k = state.k, pid = matchPreset(k), [title, sum] = PRESET_SUM[pid || "custom"], pg = state.page;
    $("#notesTitle").textContent = title + " · 当前页：" + pageLabel(pg);
    $("#notesSum").textContent = sum;
    const changed = Object.keys(PRESETS.asis).filter((key) => k[key] !== PRESETS.asis[key]);
    if (!changed.length) {
      $("#notes").innerHTML = [...PAGE_PROBLEMS[pg], ...GLOBAL_PROBLEMS].map(([t, d, knob]) => '<div class="note"><h3>' + t + '<span class="cost">开关：' + knob + "</span></h3><p>" + esc(d) + "</p></div>").join("");
      $("#still").textContent = "";
      return;
    }
    const cards = [];
    if (k.info === "new") cards.push(PAGE_INFO[pg]);
    for (const key of changed) {
      if (key === "info") continue;
      if (key === "head") { if (pg === "servers") cards.push(HEAD_NOTE.servers); else if (pg !== "data" && pg !== "terminal" && pg !== "traffic") cards.push(HEAD_NOTE.content); continue; }
      cards.push(NOTE[key + ":" + k[key]]);
    }
    $("#notes").innerHTML = cards.map(noteCard).join("");
    const same = KNOBS.filter(([key]) => key !== "theme" && k[key] === PRESETS.asis[key]).map(([, label, opts]) => label + "（" + opts[0][1] + "）");
    $("#still").textContent = same.length ? "保持现状：" + same.join("、") + "。" : "";
  }

  /* ================= hold to compare ================= */
  function holdOn() {
    if (held) return;
    held = { ...state.k };
    apply({ ...PRESETS.asis, theme: held.theme }, true);
    $("#holdBadge").hidden = false; $("#holdBtn").classList.add("on");
  }
  function holdOff() {
    if (!held) return;
    const k = held; held = null;
    apply(k, true);
    $("#holdBadge").hidden = true; $("#holdBtn").classList.remove("on");
  }
  const typing = (el) => el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable);
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" && !typing(e.target)) {
      e.preventDefault();
      if (document.activeElement && document.activeElement.tagName === "BUTTON") document.activeElement.blur();
      if (!e.repeat) holdOn();
    } else if (e.key === "Escape") {
      if (menuEl) { const a = menuAnchor; closeMenu(); if (a) a.focus(); }
      else if (mock.classList.contains("immersive")) toggleFocus(false);
    }
  });
  document.addEventListener("keyup", (e) => { if (e.code === "Space") holdOff(); });
  window.addEventListener("blur", holdOff);
  const hb = $("#holdBtn");
  hb.addEventListener("pointerdown", (e) => { e.preventDefault(); hb.setPointerCapture(e.pointerId); holdOn(); });
  hb.addEventListener("pointerup", holdOff);
  hb.addEventListener("pointercancel", holdOff);

  /* ================= events ================= */
  $("#presets").addEventListener("click", (e) => {
    const b = e.target.closest("[data-preset]"); if (!b || held) return;
    apply({ ...PRESETS[b.dataset.preset], theme: state.k.theme });
  });
  $("#knobs").addEventListener("click", (e) => { const b = e.target.closest("[data-knob]"); if (b) setKnob(b.dataset.knob, b.dataset.v); });
  document.addEventListener("click", (e) => {
    if (menuEl && !menuEl.contains(e.target) && e.target.closest("[data-act]") !== menuAnchor) closeMenu();
  });
  mock.addEventListener("input", (e) => {
    if (e.target.id === "mCallsQ") { state.q = e.target.value; $("#mCalls").innerHTML = callsHtml(); }
    else if (e.target.id === "mSideQ") { state.sideQ = e.target.value; renderSide(); }
  });
  mock.addEventListener("change", (e) => {
    if (e.target.matches("input[data-rowchk]")) e.target.closest("tr").classList.toggle("checked", e.target.checked);
  });
  mock.addEventListener("scroll", (e) => {
    const t = e.target;
    if (t.id === "mBody") {
      const det = $("#mDetail");
      if (t.scrollTop > 24) det.classList.add("scrolled"); else if (t.scrollTop === 0) det.classList.remove("scrolled");
    } else if (t.id === "mPane") t.classList.toggle("scrolled", t.scrollTop > 0);
  }, true);
  mock.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]");
    if (!b || !mock.contains(b)) return;
    const act = b.dataset.act, v = b.dataset.v;
    if (act === "seat") { const pl = PLUGINS.find((p) => p.id === v); go(state.lastPage[pl.id] || pl.pages[0][0]); }
    else if (act === "page") go(v);
    else if (act === "noop") toast(v + "（原型不执行）");
    else if (act === "menu") openMenu(b, MENUS[b.dataset.menu]);
    else if (act === "theme") setKnob("theme", state.k.theme === "dark" ? "light" : "dark");
    else if (act === "lang") toast("中文界面不在这个原型里");
    else if (act === "focus") toggleFocus();
    else if (act === "grp") { state.collapsed[b.dataset.g] = !state.collapsed[b.dataset.g]; renderSide(); }
    else if (act === "pgrp") { state.pc[b.dataset.g] = !state.pc[b.dataset.g]; rerenderPane(); }
    else if (act === "srv") select(b.dataset.id);
    else if (act === "seg") { state.seg = v; renderHead(); renderBody(); }
    else if (act === "tseg") { state.trafficAll = v === "Everything"; rerenderPane(); }
    else if (act === "tbl") { state.table = v; const keep = document.querySelector(".m-dbtables").scrollTop; renderPage(); document.querySelector(".m-dbtables").scrollTop = keep; }
    else if (act === "term") { state.term = +v; renderPage(); }
    else if (act === "call") {
      const id = b.dataset.id;
      if (state.open.has(id)) state.open.delete(id); else state.open.add(id);
      if (state.page === "servers") $("#mCalls").innerHTML = callsHtml(); else rerenderPane();
    }
    else if (act === "copy") {
      const c = BYID[b.dataset.id], val = c[b.dataset.kind];
      copyText(typeof val === "string" ? val : (b.dataset.raw ? JSON.stringify(val) : JSON.stringify(val, null, 2)));
    }
    else if (act === "blockmore") {
      const val = BYID[b.dataset.id][b.dataset.kind];
      openMenu(b, [{ label: "Copy raw", run: () => copyText(outText(val)) }, { label: "Open in Run" }]);
    }
    else if (act === "copyref") copyText(secretRef(v));
    else if (act === "restart") { const id = state.sel; toast("Restarting " + id + "…"); setTimeout(() => toast(id + " is up"), 900); }
    else if (act === "sw") b.setAttribute("aria-checked", String(b.getAttribute("aria-checked") !== "true"));
  });

  /* ================= boot ================= */
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("swiss-directions-2") || "null"); } catch (e) { saved = null; }
  const valid = saved && saved.k && KNOBS.every(([key, , opts]) => opts.some(([v]) => v === saved.k[key]));
  if (saved && typeof saved.page === "string" && pluginOf(saved.page)) { state.page = saved.page; state.lastPage[pluginOf(saved.page).id] = saved.page; }
  renderChrome();
  apply(valid ? saved.k : { ...PRESETS.b, theme: "dark" });
})();
</script>
</body>
</html>
