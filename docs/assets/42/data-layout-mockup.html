<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data page — layout studies</title>
<style>
/* ==================================================================================================
   Data page layout studies.

   Four competing answers to one question: the Data workspace has ~12 controls competing in a
   single toolbar row, and nothing on screen says which of them switch the view and which of them
   act on it. Every study below keeps the Swiss App Shell (rail -> context bar -> page body) and
   the Swiss token set untouched; only the page body's own layout differs.

   This file is a design artefact, not shipping code: it hard-codes fixtures so every state can be
   inspected side by side. Tokens are copied verbatim from styles/base.css so the studies can be
   judged on structure rather than on colour drift.
   ================================================================================================== */

/* --- tokens (verbatim from crates/swiss-panel/src/admin_assets/styles/base.css) ----------------- */
:root {
  color-scheme: light;
  --f-title: 22px; --f-head: 15px; --f-body: 13px; --f-label: 12px; --f-caption: 11px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px;
  --r-card: 8px; --r-row: 6px; --r-btn: 6px; --r-pill: 980px;
  --sans: "Inter", "Segoe UI Variable Text", "Segoe UI", -apple-system, system-ui, "PingFang SC", "Microsoft YaHei UI", sans-serif;
  --mono: "SF Mono", "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --bg: #fafafa; --sidebar: #f4f4f5; --bar: #ffffff; --card: #ffffff; --field: #ffffff;
  --text: #111114; --text-2: #6b7280; --text-3: #9ca3af;
  --sep: rgba(0,0,0,.08); --sep-soft: rgba(0,0,0,.05); --hover: rgba(0,0,0,.04);
  --accent: #2563eb; --accent-text: #fff;
  --green: #16a34a; --red: #dc2626; --amber: #d97706;
  --shadow-card: 0 0 0 1px var(--sep);
  --shadow-sheet: 0 24px 60px rgba(20,24,36,.24), 0 0 0 1px var(--sep);
  --shadow-pop: 0 8px 24px rgba(20,24,36,.14), 0 0 0 1px var(--sep);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1012; --sidebar: #141518; --bar: #141518; --card: #191a1e; --field: #0f1012;
  --text: #ededef; --text-2: #9a9ca3; --text-3: #66686f;
  --sep: rgba(255,255,255,.08); --sep-soft: rgba(255,255,255,.05); --hover: rgba(255,255,255,.05);
  --accent: #3b82f6; --green: #4ade80; --red: #f87171; --amber: #fbbf24;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: #1b1c20; color: var(--text);
  font: var(--f-body)/1.5 var(--sans); -webkit-font-smoothing: antialiased;
}

/* --- studio chrome: deliberately outside the design language ----------------------------------- */
.mock {
  position: sticky; top: 0; z-index: 50;
  display: flex; flex-wrap: wrap; align-items: center; gap: 18px;
  padding: 10px 16px; background: #131418; color: #d9dae0;
  border-bottom: 1px solid rgba(255,255,255,.1); font-size: 12px;
}
.mock b { color: #fff; font-weight: 600; font-size: 12px; letter-spacing: .01em; }
.mock .g { display: flex; align-items: center; gap: 6px; }
.mock .g > span:first-child { color: #797c88; text-transform: uppercase; letter-spacing: .06em; font-size: 10px; }
.mock button {
  font: inherit; cursor: pointer; padding: 4px 10px; border-radius: 5px;
  border: 1px solid rgba(255,255,255,.14); background: transparent; color: #d9dae0;
}
.mock button:hover { background: rgba(255,255,255,.08); }
.mock button[aria-pressed="true"] { background: #3b82f6; border-color: #3b82f6; color: #fff; }
.mock select {
  font: inherit; padding: 4px 8px; border-radius: 5px; background: #1e2026; color: #d9dae0;
  border: 1px solid rgba(255,255,255,.14); max-width: 260px;
}
.mock .note { flex: 1 1 100%; margin: 0; color: #8b8e9a; line-height: 1.5; padding-top: 2px;
  max-height: 3em; overflow: hidden; }
.mock .note em { color: #cdd0d8; font-style: normal; }

.stage { padding: 14px 20px 20px; display: flex; justify-content: center; }
.frame {
  width: 1440px; max-width: 100%; background: var(--bg); color: var(--text);
  /* Fit the whole app frame on screen whatever the window is: the bottom-anchored parts of a
     study (study D's dock, study C's status strip) are the point of the comparison. */
  height: clamp(520px, calc(100vh - 150px), 900px);
  border-radius: 10px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.45);
  display: flex; flex-direction: column; position: relative;
}
body[data-width="900"] .frame { width: 900px; }

/* --- the App Shell (invariant across every study) ---------------------------------------------- */
.app { flex: 1; display: flex; min-height: 0; }
.rail {
  width: 48px; flex: 0 0 48px; background: var(--sidebar); border-right: 1px solid var(--sep);
  display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 2px;
}
.seat {
  width: 36px; height: 36px; border-radius: var(--r-row); display: grid; place-items: center;
  color: var(--text-2); position: relative;
}
.seat.on { color: var(--text); background: var(--hover); }
.seat.on::before {
  content: ""; position: absolute; left: 2px; top: 8px; bottom: 8px; width: 2px;
  border-radius: 2px; background: var(--accent);
}
.railcol { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.ctxbar {
  height: 44px; flex: 0 0 44px; background: var(--bar); border-bottom: 1px solid var(--sep);
  display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s4);
}
.ctxbar .title { display: flex; align-items: center; gap: var(--s2); font-weight: 600; }
.ctxbar .spacer { flex: 1; }
.ctxbar .status { color: var(--text-2); font-size: var(--f-label); }
.pane { flex: 1; min-height: 0; display: flex; }

/* --- shared primitives ------------------------------------------------------------------------- */
.ic { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.5;
      stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
.ic.s18 { width: 18px; height: 18px; }
.btn {
  font: var(--f-label)/1 var(--sans); height: 28px; padding: 0 10px; border-radius: var(--r-btn);
  border: 1px solid var(--sep); background: var(--card); color: var(--text);
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.icon { width: 28px; padding: 0; justify-content: center; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--hover); color: var(--text); }
.btn[disabled] { opacity: .4; cursor: default; }
.field {
  font: var(--f-label)/1 var(--sans); height: 28px; padding: 0 8px; border-radius: var(--r-btn);
  border: 1px solid var(--sep); background: var(--field); color: var(--text); min-width: 0;
}
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex: 0 0 auto; }
.dot.idle { background: transparent; box-shadow: inset 0 0 0 1.5px var(--text-3); }
.dot.down { background: var(--red); }
.chip {
  font: var(--f-caption)/1 var(--mono); color: var(--text-2); border: 1px solid var(--sep);
  border-radius: var(--r-pill); padding: 3px 7px; white-space: nowrap;
}
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.dim { color: var(--text-3); }
.seg { display: inline-flex; background: var(--hover); border-radius: var(--r-btn); padding: 2px; }
.seg button {
  font: var(--f-label)/1 var(--sans); height: 24px; padding: 0 10px; border: 0; border-radius: 4px;
  background: transparent; color: var(--text-2); cursor: pointer; white-space: nowrap;
}
.seg button[aria-selected="true"] { background: var(--card); color: var(--text); box-shadow: var(--shadow-card); }
.utabs { display: flex; gap: var(--s4); align-items: stretch; height: 100%; }
.utabs a {
  display: flex; align-items: center; font-size: var(--f-label); color: var(--text-2);
  text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer;
}
.utabs a[aria-current="page"] { color: var(--text); border-bottom-color: var(--accent); }

/* --- explorer frame ---------------------------------------------------------------------------- */
.db-root { display: flex; flex: 1; min-height: 0; width: 100%; }
.db-side {
  width: 248px; flex: 0 0 248px; background: var(--sidebar); border-right: 1px solid var(--sep);
  display: flex; flex-direction: column; min-height: 0;
}
.db-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.db-sidetop { padding: var(--s2); display: flex; flex-direction: column; gap: 6px; }
.db-sidetop .field { width: 100%; }
.db-listhead {
  display: flex; align-items: center; gap: var(--s2); height: 28px; padding: 0 var(--s2) 0 var(--s3);
  color: var(--text-2); font-size: var(--f-caption); text-transform: uppercase; letter-spacing: .06em;
}
.db-listhead .n { margin-left: auto; }
.db-list { flex: 1; overflow: auto; padding: 0 var(--s1) var(--s2); }
.db-sidefoot {
  height: 34px; flex: 0 0 34px; border-top: 1px solid var(--sep); display: flex; align-items: center;
  gap: var(--s1); padding: 0 var(--s2); color: var(--text-3); font-size: var(--f-caption);
}
.db-sidefoot .sp { flex: 1; }
.trow {
  width: 100%; text-align: left; border: 0; background: transparent; color: var(--text);
  border-radius: var(--r-row); padding: 5px var(--s2); cursor: pointer; display: block; position: relative;
}
.trow:hover { background: var(--hover); }
.trow.sel { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.trow.sel::before {
  content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 2px;
  background: var(--accent); border-radius: 2px;
}
.trow .nm { font-size: var(--f-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow.sel .nm { font-weight: 600; }
.trow .mt { font-size: var(--f-caption); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow.one { display: flex; align-items: center; gap: var(--s2); }
.trow.one .nm { flex: 1; }
.trow.one .mt { flex: 0 0 auto; font-variant-numeric: tabular-nums; }
.band {
  display: flex; align-items: center; gap: var(--s2); height: 28px; padding: 0 var(--s2);
  background: var(--sep-soft); border-radius: var(--r-row); cursor: pointer;
  font-size: var(--f-body); font-weight: 600; margin-top: var(--s2);
}
.band .n { margin-left: auto; color: var(--text-3); font-variant-numeric: tabular-nums; font-weight: 400; }
.band + .bandbody { padding-left: var(--s4); padding-top: var(--s1); }

/* --- toolbars ---------------------------------------------------------------------------------- */
.idrow {
  display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4) var(--s2);
  min-height: 0;
}
.idrow .txt { min-width: 0; }
.idrow h2 { margin: 0; font-size: var(--f-head); font-weight: 600; letter-spacing: -.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.idrow .meta { font-size: var(--f-label); color: var(--text-2); margin-top: 2px; }
.idrow .sp { flex: 1; }
.viewrow {
  display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s4) var(--s2);
  border-bottom: 1px solid var(--sep);
}
.viewrow .sp { flex: 1; }
.pager { display: inline-flex; align-items: center; gap: var(--s1); color: var(--text-2); font-size: var(--f-label); }
.pager .rng { font-variant-numeric: tabular-nums; white-space: nowrap; padding: 0 var(--s1); }

/* --- grid -------------------------------------------------------------------------------------- */
.gridwrap { flex: 1; min-height: 0; overflow: auto; }
table.grid { border-collapse: separate; border-spacing: 0; font-size: var(--f-label); width: max-content; min-width: 100%; }
table.grid th {
  position: sticky; top: 0; z-index: 2; background: var(--bar); text-align: left; font-weight: 500;
  border-bottom: 1px solid var(--sep); border-right: 1px solid var(--sep-soft);
  padding: 6px var(--s2); white-space: nowrap; vertical-align: top;
}
table.grid th .cn { color: var(--text); }
table.grid th .ct { color: var(--text-3); font-family: var(--mono); font-size: var(--f-caption); margin-left: 6px; }
table.grid th .cc { display: block; color: var(--text-3); font-size: var(--f-caption); font-weight: 400;
  max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
table.grid td {
  border-bottom: 1px solid var(--sep-soft); border-right: 1px solid var(--sep-soft);
  padding: 5px var(--s2); white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--text);
}
table.grid td.num { text-align: right; }
table.grid td.null { color: var(--text-3); font-style: italic; }
table.grid tr:hover td { background: var(--hover); }
table.grid td.k { position: sticky; left: 0; background: var(--bg); z-index: 1;
  border-right: 1px solid var(--sep); color: var(--text-3); text-align: center; width: 54px; }
table.grid tr:hover td.k { background: var(--hover); }
table.grid th.k { left: 0; z-index: 3; width: 54px; }
td.edited { box-shadow: inset 0 0 0 1px var(--amber); background: color-mix(in srgb, var(--amber) 9%, transparent) !important; }
tr.inserted td { background: color-mix(in srgb, var(--green) 8%, transparent); }
tr.deleted td { opacity: .45; text-decoration: line-through; }
td.focus { box-shadow: inset 0 0 0 2px var(--accent); }
.mono-cell { font-family: var(--mono); }

/* --- commit bar, filters, console, dock -------------------------------------------------------- */
.commitbar {
  display: flex; align-items: center; gap: var(--s2); padding: var(--s2) var(--s4);
  border-top: 1px solid var(--sep); background: color-mix(in srgb, var(--amber) 10%, var(--bar));
  font-size: var(--f-label);
}
.commitbar .sp { flex: 1; }
.commitbar b { color: var(--amber); }
.filters {
  display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap;
  padding: var(--s2) var(--s4); border-bottom: 1px solid var(--sep); background: var(--bar);
}
.fchip {
  display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 var(--s2);
  border: 1px solid var(--sep); border-radius: var(--r-pill); background: var(--card);
  font-size: var(--f-caption); font-family: var(--mono);
}
.fchip .x { color: var(--text-3); cursor: pointer; }
.console { border-bottom: 1px solid var(--sep); background: var(--bar); }
.console .editor {
  margin: var(--s2) var(--s4) 0; border: 1px solid var(--sep); border-radius: var(--r-row);
  background: var(--field); padding: var(--s2); font: var(--f-label)/1.6 var(--mono);
  min-height: 74px; white-space: pre-wrap; color: var(--text);
}
.console .kw { color: var(--accent); }
.console .str { color: var(--green); }
.console .row { display: flex; align-items: center; gap: var(--s2); padding: var(--s2) var(--s4); }
.console .row .sp { flex: 1; }
.console .hint { font-size: var(--f-caption); color: var(--text-3); }
.dock { border-top: 1px solid var(--sep); background: var(--bar); display: flex; flex-direction: column; }
.dock .grip { height: 5px; cursor: row-resize; background: transparent; border-bottom: 1px solid var(--sep-soft); }
.dock .tabs { display: flex; align-items: center; gap: var(--s4); height: 32px; padding: 0 var(--s4);
  border-bottom: 1px solid var(--sep-soft); }
.dock .body { flex: 1; min-height: 0; overflow: auto; }

/* --- object tabs (study B) --------------------------------------------------------------------- */
.otabs {
  display: flex; align-items: stretch; height: 34px; background: var(--sidebar);
  border-bottom: 1px solid var(--sep); overflow-x: auto;
}
.otab {
  display: flex; align-items: center; gap: 6px; padding: 0 var(--s3); cursor: pointer;
  border-right: 1px solid var(--sep); color: var(--text-2); font-size: var(--f-label);
  white-space: nowrap; background: transparent; border-top: 2px solid transparent;
}
.otab[aria-selected="true"] { background: var(--bar); color: var(--text); border-top-color: var(--accent); }
.otab .x { color: var(--text-3); width: 14px; height: 14px; }
.otab.add { color: var(--text-3); }

/* --- study-specific layout --------------------------------------------------------------------- */
/* A — two rows: identity above, view switch + scoped actions below. */
[data-study="a"] .viewrow { padding-top: 0; }

/* B — object tabs: one scoped toolbar, sidebar is a tree. */
[data-study="b"] .db-side { flex-basis: 264px; width: 264px; }
[data-study="b"] .idrow { display: none; }
[data-study="b"] .viewrow { padding: var(--s2) var(--s4); }
[data-study="b"] .btitle { display: flex; align-items: center; gap: var(--s2); min-width: 0; }
[data-study="b"] .btitle .nm { font-weight: 600; font-size: var(--f-body); }

/* C — quiet: one 36px bar, pager in a bottom status strip. */
[data-study="c"] .db-side { flex-basis: 232px; width: 232px; }
[data-study="c"] .idrow { padding: 0 var(--s4); height: 36px; align-items: center; }
[data-study="c"] .idrow h2 { font-size: var(--f-body); font-weight: 500; }
[data-study="c"] .idrow .meta { display: none; }
[data-study="c"] .viewrow { padding: 0 var(--s4); border-bottom: 1px solid var(--sep); height: 30px; }
.statusbar {
  height: 28px; flex: 0 0 28px; border-top: 1px solid var(--sep); background: var(--bar);
  display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s4);
  font-size: var(--f-caption); color: var(--text-2);
}
.statusbar .sp { flex: 1; }
.crumb { display: flex; align-items: center; gap: 6px; font-size: var(--f-body); min-width: 0; }
.crumb .sepx { color: var(--text-3); }
.crumb .last { font-weight: 600; }
.qbar {
  display: flex; align-items: center; gap: var(--s2); padding: var(--s2) var(--s4);
  border-bottom: 1px solid var(--sep); background: var(--bar);
}
.qbar .box {
  flex: 1; height: 28px; border: 1px solid var(--sep); border-radius: var(--r-btn);
  background: var(--field); padding: 0 var(--s2); display: flex; align-items: center; gap: 6px;
  font: var(--f-label)/1 var(--mono); color: var(--text);
}
.qbar .box .lead { color: var(--text-3); }

/* D — docked workspace. */
[data-study="d"] .idrow { padding-bottom: var(--s2); }
[data-study="d"] .viewrow { border-bottom: 1px solid var(--sep); }

/* --- structure / form / activity / redis ------------------------------------------------------- */
.pad { padding: var(--s4); overflow: auto; flex: 1; min-height: 0; }
.card { background: var(--card); border-radius: var(--r-card); box-shadow: var(--shadow-card); overflow: hidden; }
.card + .card { margin-top: var(--s4); }
.cardhead { display: flex; align-items: center; gap: var(--s2); height: 36px; padding: 0 var(--s3);
  background: var(--sep-soft); font-weight: 600; font-size: var(--f-body); }
.cardhead .sp { flex: 1; }
table.plain { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--f-label); }
table.plain th { text-align: left; font-weight: 500; color: var(--text-2); padding: 6px var(--s3);
  border-bottom: 1px solid var(--sep); white-space: nowrap; }
table.plain td { padding: 6px var(--s3); border-bottom: 1px solid var(--sep-soft); }
table.plain tr:last-child td { border-bottom: 0; }
pre.ddl { margin: 0; padding: var(--s3); font: var(--f-label)/1.65 var(--mono); color: var(--text);
  white-space: pre; overflow: auto; }
.formgrid { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 1px; background: var(--sep-soft); }
.formgrid .fl { background: var(--card); padding: 7px var(--s3); color: var(--text-2); font-size: var(--f-label); }
.formgrid .fv { background: var(--card); padding: 7px var(--s3); font-size: var(--f-label); }
.formgrid .fv.mono { font-family: var(--mono); }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: var(--s2); flex: 1; padding: var(--s8); text-align: center; }
.empty .eic { color: var(--text-3); }
.empty h3 { margin: 0; font-size: var(--f-head); font-weight: 600; }
.empty p { margin: 0; max-width: 44ch; color: var(--text-2); font-size: var(--f-label); }
.banner { display: flex; gap: var(--s2); align-items: flex-start; margin: var(--s4); padding: var(--s3);
  border-radius: var(--r-card); background: color-mix(in srgb, var(--red) 8%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--red) 30%, transparent); font-size: var(--f-label); }
.banner .t { font-weight: 600; color: var(--red); }
.banner code { font-family: var(--mono); }

/* --- overlays: sheet + popup menu -------------------------------------------------------------- */
.scrim { position: absolute; inset: 0; background: rgba(15,16,18,.42); display: grid; place-items: center; z-index: 30; }
.sheet { width: 560px; max-width: calc(100% - 48px); max-height: 80%; background: var(--card);
  border-radius: var(--r-card); box-shadow: var(--shadow-sheet); display: flex; flex-direction: column; }
.sheet .sh { padding: var(--s4) var(--s4) var(--s2); font-size: var(--f-head); font-weight: 600; }
.sheet .sb { padding: 0 var(--s4) var(--s4); overflow: auto; display: flex; flex-direction: column; gap: var(--s3); }
.sheet .sf { display: flex; gap: var(--s2); justify-content: flex-end; padding: var(--s3) var(--s4);
  border-top: 1px solid var(--sep); }
.lbl { font-size: var(--f-label); color: var(--text-2); display: block; margin-bottom: var(--s1); }
.popup { position: absolute; z-index: 40; min-width: 200px; background: var(--card); border-radius: var(--r-row);
  box-shadow: var(--shadow-pop); padding: var(--s1); }
.popup .mi { display: flex; align-items: center; gap: var(--s2); height: 30px; padding: 0 var(--s2);
  border-radius: 4px; font-size: var(--f-label); cursor: pointer; }
.popup .mi:hover { background: var(--hover); }

  var study = ui.study, redis = e.kind === "redis";
  var showViews = !redis && ["browse", "filters", "edits", "readonly", "nopk", "empty", "form", "structure", "ddl", "value", "import", "menu", "error"].indexOf(sc) >= 0;
  var isResult = sc === "sql" || sc === "explain";
  var editable = sc !== "readonly";
  var title = redis ? (sc === "keys" || sc === "empty" ? "Keys" : e.qualified) : (isResult ? (sc === "explain" ? "Execution plan" : "SQL results") : e.qualified);

  if (study === "b") {
    var tabs = h("div", { class: "otabs" },
      h("button", { class: "otab", type: "button" }, icon("table", "dim"), "shop_order", h("span", { class: "x" }, "✕")),
      h("button", { class: "otab", "aria-selected": !isResult ? "true" : "false", type: "button" },
        icon(redis ? "key" : "table", "dim"), redis ? e.qualified : e.table, h("span", { class: "x" }, "✕")),
      h("button", { class: "otab", "aria-selected": isResult ? "true" : "false", type: "button" },
        icon("code", "dim"), redis ? "Command 1" : "SQL 1", h("span", { class: "x" }, "✕")),
      h("button", { class: "otab add", type: "button", title: "New editor" }, icon("plus")));
    add(main, tabs);
    add(main, h("div", { class: "viewrow" },
      h("span", { class: "btitle" },
        h("span", { class: "nm" }, title),
        h("span", { class: "chip" }, redis ? (sc === "keys" || sc === "empty" ? "—" : redisTypeOf(e)) : (sc === "readonly" ? "read-only" : "editable")),
        // The chip already names the type on a redis key, so the line beside it shows the NEXT
        // fact (its expiry) rather than saying "hash hash".
        h("span", { class: "dim", style: "font-size:var(--f-label)" }, metaLine(e, sc).split(" · ")[redis ? 1 : 0])),
      h("span", { class: "sp" }),
      showViews ? segControl(viewOf(sc), SQL_VIEWS) : null,
      !redis && !isResult && showViews && viewOf(sc) === "Data" ? pagerBits(e, sc) : null,
      editable && !isResult && !redis ? h("button", { class: "btn primary", type: "button" }, icon("plus"), "Row") : null,
      redis && !isResult && sc !== "keys" && sc !== "empty" && sc !== "command"
        && ["hash", "list", "set", "zset"].indexOf(redisTypeOf(e)) >= 0
        ? h("button", { class: "btn primary", type: "button" }, icon("plus"),
            redisTypeOf(e) === "list" ? "Item" : redisTypeOf(e) === "hash" ? "Field" : "Member") : null,
      h("button", { class: "btn icon ghost", type: "button", title: "More actions" }, icon("ellipsis"))));
    return;
  }

  if (study === "c") {
    add(main, h("div", { class: "idrow" },
      h("span", { class: "crumb" },
        h("span", { class: "muted" }, e.label.split(" · ")[0]),
        h("span", { class: "sepx" }, "›"),
        h("span", { class: "muted" }, e.db),
        h("span", { class: "sepx" }, "›"),
        h("span", { class: "last" }, redis ? e.qualified : (isResult ? title : e.table))),
      h("span", { class: "sp" }),
      h("span", { class: "chip" }, "⌘K"),
      h("button", { class: "btn icon ghost", type: "button", title: "Refresh" }, icon("refresh")),
      h("button", { class: "btn icon ghost", type: "button", title: "More actions" }, icon("ellipsis"))));
    if (showViews) add(main, h("div", { class: "viewrow" }, underline(viewOf(sc), SQL_VIEWS)));
    return;
  }

  // A and D share the identity row; D keeps only one action row because its dock absorbs the rest.
  add(main, h("div", { class: "idrow" },
    h("span", { class: "txt" },
      h("h2", {}, title),
      h("div", { class: "meta" }, metaLine(e, sc))),
    h("span", { class: "sp" }),
    study === "a" && !redis ? h("button", { class: "btn", type: "button" }, icon("code"), "SQL") : null,
    h("button", { class: "btn icon ghost", type: "button", title: "More actions" }, icon("ellipsis"))));

  var row = h("div", { class: "viewrow" });
  if (showViews) add(row, segControl(viewOf(sc), SQL_VIEWS));
  if (redis && !isResult) add(row, segControl(sc === "command" ? "Command" : "Value", ["Value", "Command"]));
  add(row, h("span", { class: "sp" }));
  if (isResult) {
    add(row, segControl("SELECT · 2", ["SELECT · 2", "SELECT · 118,402"]));
    add(row, h("span", { class: "dim", style: "font-size:var(--f-caption)" }, "12 ms"));
    add(row, h("button", { class: "btn", type: "button" }, "Back to table"));
  } else if (!redis && viewOf(sc) === "Data") {
    add(row, pagerBits(e, sc));
    add(row, h("button", { class: "btn icon ghost", type: "button", title: "Reload page" }, icon("refresh")));
    if (editable) add(row, h("button", { class: "btn primary", type: "button" }, icon("plus"), "Row"));
    add(row, h("button", { class: "btn icon ghost", type: "button", title: "Export, import, generate SQL…" }, icon("ellipsis")));
  } else if (redis && sc !== "command") {
    add(row, h("button", { class: "btn icon ghost", type: "button", title: "Reload key" }, icon("refresh")));
    // Only a collection key can take a new member; a string key edits in place.
    var rt = redisTypeOf(e);
    if (sc !== "keys" && sc !== "empty" && ["hash", "list", "set", "zset"].indexOf(rt) >= 0) {
      add(row, h("button", { class: "btn primary", type: "button" }, icon("plus"),
        rt === "zset" || rt === "set" ? "Member" : rt === "list" ? "Item" : "Field"));
    }
    add(row, h("button", { class: "btn icon ghost", type: "button", title: "Rename, TTL, delete…" }, icon("ellipsis")));
  } else if (redis) {
    add(row, h("button", { class: "btn icon ghost", type: "button", title: "Command reference" }, icon("ellipsis")));
  }
  add(main, row);
}

/* --- body -------------------------------------------------------------------------------------- */
function renderMain(e, sc) {
  var main = h("div", { class: "db-main" }), study = ui.study, redis = e.kind === "redis";

  if (sc === "noconn") {
    add(main, h("div", { class: "empty" },
      icon("database", "eic ic s18"),
      h("h3", {}, "No database connections"),
      h("p", {}, "Data browses the connections the MCP plugin owns. Register a mysql, postgres or redis MCP and it appears here."),
      h("button", { class: "btn", type: "button" }, "Open MCP servers")));
    return main;
  }

  renderChrome(e, sc, main);

  var isResult = sc === "sql" || sc === "explain";
  var consoleOpen = isResult || sc === "command";
  var dock = study === "d";

  if (!redis && sc === "error") {
    add(main, h("div", { class: "banner" }, icon("warn"),
      h("span", {},
        h("span", { class: "t" }, "The database refused the request"), h("br"),
        h("code", {}, "Data too long for column 'code' at row 1"), h("br"),
        h("span", { class: "muted" }, "The driver's own message, passed through unchanged. The buffer is intact — fix the value and Commit again."))));
  }

  // Console placement is a study decision: A/B push it above the grid, C opens it as the body of
  // a SQL tab, D parks it in the dock.
  if (consoleOpen && !dock) add(main, sqlConsole(e, sc, false));

  if (redis) {
    if (sc === "command") {
      add(main, resultBlockRedis());
    } else {
      add(main, redisValueBlock(e, sc));
      if (sc === "edits") add(main, redisCommandPreview());
    }
  } else if (isResult) {
    add(main, resultBlock(e, sc));
  } else if (sc === "activity") {
    add(main, activityBlock(e));
  } else if (viewOf(sc) === "Form") {
    add(main, formBlock(e));
  } else if (viewOf(sc) === "Structure") {
    add(main, structureBlock(e));
  } else if (viewOf(sc) === "DDL") {
    add(main, ddlBlock(e));
  } else {
    if (study === "c") {
      add(main, h("div", { class: "qbar" },
        h("span", { class: "box" }, h("span", { class: "lead" }, "WHERE"),
          h("span", {}, sc === "filters" ? "direction = 1 AND code LIKE 'ORD38%'" : ""),
          !sc || sc !== "filters" ? h("span", { class: "dim" }, "column = value …") : null),
        h("button", { class: "btn", type: "button" }, "Apply")));
    } else {
      add(main, filterBar(sc));
    }
    add(main, gridBlock(e, sc));
  }

  if (sc === "edits" && !redis) {
    add(main, h("div", { class: "commitbar" },
      h("b", {}, "3 uncommitted changes"),
      h("span", { class: "muted" }, "1 update · 1 insert · 1 delete — LOCAL ONLY, nothing has been written"),
      h("span", { class: "sp" }),
      h("button", { class: "btn", type: "button" }, "SQL"),
      h("button", { class: "btn", type: "button" }, "Discard"),
      h("button", { class: "btn primary", type: "button" }, "Commit (1 transaction)")));
  }
  if (sc === "edits" && redis) {
    add(main, h("div", { class: "commitbar" },
      h("b", {}, "3 uncommitted changes"),
      h("span", { class: "muted" }, "1 set · 1 add · 1 delete — sent as one pipeline"),
      h("span", { class: "sp" }),
      h("button", { class: "btn", type: "button" }, "Discard"),
      h("button", { class: "btn primary", type: "button" }, "Commit (1 pipeline)")));
  }

  if (dock) {
    var dockTab = consoleOpen ? (redis ? "Command" : "SQL") : (sc === "value" ? "Value" : (sc === "activity" ? "Activity" : (redis ? "Command" : "SQL")));
    var tabs = redis ? ["Command", "Value", "Messages"] : ["SQL", "Value", "Row", "Messages", "Activity"];
    var d = h("div", { class: "dock", style: "flex:0 0 " + (consoleOpen ? "226px" : "180px") },
      h("div", { class: "grip" }),
      h("div", { class: "tabs" }, underline(dockTab, tabs),
        h("span", { class: "sp", style: "flex:1" }),
        h("span", { class: "dim", style: "font-size:var(--f-caption)" }, "12 ms · 2 rows"),
        h("button", { class: "btn icon ghost", type: "button", title: "Collapse dock" }, icon("down"))),
      h("div", { class: "body" }, dockTab === "SQL" || dockTab === "Command"
        ? sqlConsole(e, sc, true)
        : dockTab === "Value"
          ? h("pre", { class: "ddl" }, '{\n  "sku": "A-19",\n  "qty": 2,\n  "channel": "web"\n}')
          : dockTab === "Activity" ? activityBlock(e) : h("div", { class: "pad muted" }, "Query OK, 2 rows affected (0.012 sec)")));
    add(main, d);
  }

  if (study === "c") {
    add(main, h("div", { class: "statusbar" },
      h("span", {}, redis ? (sc === "keys" ? "450 keys" : "hash · 5 fields") : (sc === "filters" ? "1–14 of 118,402" : "1–50 of " + n(e.total))),
      !redis && h("button", { class: "btn icon ghost", type: "button", title: "Previous page", disabled: true }, icon("left")),
      !redis && h("button", { class: "btn icon ghost", type: "button", title: "Next page" }, icon("right")),
      !redis && h("span", { class: "chip" }, "50 / page"),
      h("span", { class: "sp" }),
      h("span", {}, "12 ms"),
      h("span", {}, sc === "readonly" ? "read-only" : "editable"),
      h("span", {}, e.label)));
  }
  return main;
}

function resultBlockRedis() {
  var t = h("table", { class: "grid" });
  add(t, h("thead", {}, h("tr", {}, h("th", {}, h("span", { class: "cn" }, "reply")))));
  add(t, h("tbody", {}, ["display_name", "Ada Lovelace", "email", "ada@example.com", "locale", "en-GB", "tier", "gold"].map(function (x) {
    return h("tr", {}, h("td", { class: "mono-cell" }, x));
  })));
  return h("div", { class: "gridwrap" }, t);
}

/* --- overlays ---------------------------------------------------------------------------------- */
function overlayFor(e, sc) {
  if (sc === "import") {
    return h("div", { class: "scrim" }, h("div", { class: "sheet" },
      h("div", { class: "sh" }, "Import CSV into " + e.qualified),
      h("div", { class: "sb" },
        h("div", {}, h("span", { class: "lbl" }, "Mode"), segControl("Insert", ["Insert", "Upsert"]),
          h("div", { class: "dim", style: "margin-top:6px;font-size:var(--f-caption)" }, "Upsert needs a primary key; matching rows are updated in place.")),
        h("div", {}, h("span", { class: "lbl" }, "Source"),
          h("div", { style: "display:flex;gap:8px" },
            h("button", { class: "btn", type: "button" }, icon("file"), "Choose file…"),
            h("span", { class: "muted", style: "align-self:center;font-size:var(--f-label)" }, "orders-2026-09.csv · 412 rows"))),
        h("div", {}, h("span", { class: "lbl" }, "Column mapping"),
          h("div", { class: "card" }, h("table", { class: "plain" },
            h("thead", {}, h("tr", {}, h("th", {}, "CSV header"), h("th", {}, "Column"), h("th", {}, "First value"))),
            h("tbody", {},
              h("tr", {}, h("td", { class: "mono" }, "code"), h("td", {}, h("span", { class: "field", style: "display:inline-flex;align-items:center;gap:4px" }, "code", icon("down", "dim"))), h("td", { class: "mono dim" }, "ORD3899…")),
              h("tr", {}, h("td", { class: "mono" }, "cat"), h("td", {}, h("span", { class: "field", style: "display:inline-flex;align-items:center;gap:4px" }, "category", icon("down", "dim"))), h("td", { class: "mono dim" }, "3")),
              h("tr", {}, h("td", { class: "mono" }, "note"), h("td", {}, h("span", { class: "field", style: "display:inline-flex;align-items:center;gap:4px" }, "Skip", icon("down", "dim"))), h("td", { class: "mono dim" }, "—")))))),
        h("div", { class: "muted", style: "font-size:var(--f-label)" }, "412 rows insert in one transaction. Nothing is written until you confirm; the first error rolls the whole batch back.")),
      h("div", { class: "sf" },
        h("button", { class: "btn", type: "button" }, "Cancel"),
        h("button", { class: "btn primary", type: "button" }, "Import 412 rows"))));
  }
  if (sc === "value") {
    return h("div", { class: "scrim" }, h("div", { class: "sheet" },
      h("div", { class: "sh" }, "payload"),
      h("div", { class: "sb" },
        h("div", { style: "display:flex;gap:8px;align-items:center" },
          h("span", { class: "chip" }, "jsonb"), h("span", { class: "chip" }, "42 B"), h("span", { class: "sp", style: "flex:1" }),
          segControl("JSON", ["JSON", "Text", "Hex"])),
        h("div", { class: "card" }, h("pre", { class: "ddl" }, '{\n  "sku": "A-19",\n  "qty": 2,\n  "channel": "web"\n}')),
        h("div", { style: "display:flex;gap:8px" },
          h("button", { class: "btn", type: "button" }, "Set NULL"),
          h("button", { class: "btn", type: "button" }, "Format"),
          h("button", { class: "btn", type: "button" }, "Copy"))),
      h("div", { class: "sf" },
        h("button", { class: "btn", type: "button" }, "Cancel"),
        h("button", { class: "btn primary", type: "button" }, "Buffer change"))));
  }
  if (sc === "newtable") {
    return h("div", { class: "scrim" }, h("div", { class: "sheet", style: "width:640px" },
      h("div", { class: "sh" }, "New table in " + (e.dialect === "pg" ? "public" : e.db)),
      h("div", { class: "sb" },
        h("div", { style: "display:flex;gap:8px" },
          h("label", { style: "flex:1" }, h("span", { class: "lbl" }, "Name"), h("span", { class: "field", style: "display:block;line-height:28px" }, "shipment")),
          e.dialect === "pg" ? h("label", { style: "width:160px" }, h("span", { class: "lbl" }, "Schema"),
            h("span", { class: "field", style: "display:flex;align-items:center;justify-content:space-between" }, "public", icon("down", "dim"))) : null),
        h("div", {}, h("span", { class: "lbl" }, "Columns"),
          h("div", { class: "card" }, h("table", { class: "plain" },
            h("thead", {}, h("tr", {}, ["Name", "Type", "Null", "Default", ""].map(function (x) { return h("th", {}, x); }))),
            h("tbody", {},
              h("tr", {}, h("td", { class: "mono" }, "id"), h("td", { class: "mono" }, e.dialect === "pg" ? "bigserial" : "bigint"), h("td", {}, "NO"), h("td", { class: "dim" }, "—"), h("td", {}, icon("x", "dim"))),
              h("tr", {}, h("td", { class: "mono" }, "order_code"), h("td", { class: "mono" }, "varchar(64)"), h("td", {}, "NO"), h("td", { class: "dim" }, "—"), h("td", {}, icon("x", "dim"))),
              h("tr", {}, h("td", { class: "mono" }, "shipped_at"), h("td", { class: "mono" }, e.dialect === "pg" ? "timestamptz" : "datetime"), h("td", {}, "YES"), h("td", { class: "dim" }, "NULL"), h("td", {}, icon("x", "dim"))))),
            h("div", { style: "padding:8px" }, h("button", { class: "btn ghost", type: "button" }, icon("plus"), "Add column")))),
        h("div", {}, h("span", { class: "lbl" }, "SQL this will run"),
          h("div", { class: "card" }, h("pre", { class: "ddl" }, e.dialect === "pg"
            ? 'CREATE TABLE "public"."shipment" (\n  "id"         bigserial   NOT NULL,\n  "order_code" varchar(64) NOT NULL,\n  "shipped_at" timestamptz NULL,\n  PRIMARY KEY ("id")\n);'
            : "CREATE TABLE `shipment` (\n  `id`         bigint      NOT NULL AUTO_INCREMENT,\n  `order_code` varchar(64) NOT NULL,\n  `shipped_at` datetime    NULL,\n  PRIMARY KEY (`id`)\n);")))),
      h("div", { class: "sf" },
        h("button", { class: "btn", type: "button" }, "Cancel"),
        h("button", { class: "btn primary", type: "button" }, "Create table"))));
  }
  if (sc === "menu" || sc === "ttl") {
    var items = e.kind === "redis"
      ? [["Copy key", 0], ["Rename…", 0], ["Set TTL…", 0], ["Persist (remove TTL)", 0], ["-", 0], ["Delete key…", 1]]
      : [["Refresh", 0], ["Export CSV…", 0], ["Export NDJSON…", 0], ["Export SQL dump…", 0], ["Import CSV…", 0], ["-", 0],
         ["Generate SELECT", 0], ["Value distribution…", 0], ["Activity…", 0], ["-", 0], ["Rename table…", 0], ["Truncate table…", 1], ["Drop table…", 1]];
    return h("div", { class: "popup", style: "right:24px;top:" + (ui.study === "b" ? "88px" : "104px") },
      items.map(function (it) {
        return it[0] === "-" ? h("hr") : h("div", { class: "mi" + (it[1] ? " danger" : "") }, it[0]);
      }));
  }
  return null;
}

/* --- shell ------------------------------------------------------------------------------------- */
/* Which key the redis states open. The state names a TYPE, so the key it opens has to be one of
   that type or the header says "zset" over a hash key's name. */
var REDIS_KEY_FOR = {
  hash: "user:1001:profile", edits: "user:1001:profile", string: "config:flags",
  list: "feed:global", set: "user:1001:sessions", zset: "leaderboard:weekly",
  stream: "stream:orders", ttl: "lock:import", command: "config:flags"
};
function render() {
  var e = ENGINES[ui.eng], sc = ui.sc;
  if (e.kind === "redis") e.qualified = REDIS_KEY_FOR[sc] || "user:1001:profile";
  var frame = document.getElementById("frame");
  frame.textContent = "";
  frame.setAttribute("data-study", ui.study);

  var rail = h("nav", { class: "rail" },
    h("span", { class: "seat", title: "MCP" }, icon("plug", "s18")),
    h("span", { class: "seat", title: "Tunnels" }, icon("link", "s18")),
    h("span", { class: "seat on", title: "Data" }, icon("database", "s18")),
    h("span", { class: "seat", title: "Jobs" }, icon("clock", "s18")),
    h("span", { class: "seat", title: "Terminal" }, icon("terminal", "s18")),
    h("span", { class: "seat", title: "Settings" }, icon("settings", "s18")),
    h("span", { class: "seat", title: "More plugins" }, icon("ellipsis", "s18")));

  var ctx = h("div", { class: "ctxbar" },
    h("span", { class: "title" }, icon("database", "s18"), "Data"),
    h("span", { class: "spacer" }),
    h("span", { class: "status" }, sc === "noconn" ? "no connections" : e.label + " · " + e.sizeChip),
    h("button", { class: "btn icon ghost", type: "button", title: "Focus mode" }, icon("box")));

  var pane = h("div", { class: "pane" },
    h("div", { class: "db-root" }, renderSide(e, sc), renderMain(e, sc)));

  add(frame, h("div", { class: "app" }, rail, h("div", { class: "railcol" }, ctx, pane)));
  var ov = overlayFor(e, sc);
  if (ov) add(frame, ov);
  document.getElementById("note").innerHTML = "<b>" + STUDIES[ui.study].name + "</b> — " + STUDIES[ui.study].note;
}

/* --- studio wiring ----------------------------------------------------------------------------- */
function paintButtons() {
  var sb = document.getElementById("studyBtns");
  sb.textContent = "";
  Object.keys(STUDIES).forEach(function (k) {
    var b = h("button", { type: "button", "aria-pressed": ui.study === k ? "true" : "false" }, STUDIES[k].name);
    b.onclick = function () { ui.study = k; paintButtons(); render(); };
    sb.appendChild(b);
  });
  var eb = document.getElementById("engBtns");
  eb.textContent = "";
  [["mysql", "MySQL"], ["pg", "PostgreSQL"], ["redis", "Redis"]].forEach(function (p) {
    var b = h("button", { type: "button", "aria-pressed": ui.eng === p[0] ? "true" : "false" }, p[1]);
    b.onclick = function () { ui.eng = p[0]; paintButtons(); paintStates(); render(); };
    eb.appendChild(b);
  });
}
function paintStates() {
  var sel = document.getElementById("scSel");
  var list = ENGINES[ui.eng].kind === "redis" ? REDIS_STATES : SQL_STATES;
  var keep = list.some(function (p) { return p[0] === ui.sc; });
  if (!keep) ui.sc = list[0][0];
  sel.textContent = "";
  list.forEach(function (p) {
    var o = h("option", { value: p[0] }, p[1]);
    if (p[0] === ui.sc) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = function () { ui.sc = sel.value; render(); };
}
document.getElementById("themeBtn").onclick = function () {
  var dark = document.documentElement.getAttribute("data-theme") === "dark";
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  this.textContent = dark ? "Light" : "Dark";
};
document.getElementById("wBtn").onclick = function () {
  var narrow = document.body.getAttribute("data-width") === "900";
  document.body.setAttribute("data-width", narrow ? "1440" : "900");
  this.textContent = narrow ? "1440" : "900";
};
document.addEventListener("keydown", function (ev) {
  if (ev.target && /input|select|textarea/i.test(ev.target.tagName)) return;
  var keys = { "1": "a", "2": "b", "3": "c", "4": "d" };
  if (keys[ev.key]) { ui.study = keys[ev.key]; paintButtons(); render(); }
});
paintButtons(); paintStates(); render();
</script>
