# cargo-deny (https://github.com/EmbarkStudios/cargo-deny): the license, advisory and source
# gate. `cargo deny check` locally; CI runs it as the `deny` job. The license allowlist is
# exactly the set of expressions the dependency tree carried on 2026-09-21 (SPEC §release.hygiene) -
# every one permissive, no copyleft beyond the file-level MPL-2.0 of option-ext. A new
# license family fails the gate on purpose: it is a review, not a nuisance, and
# THIRD_PARTY_NOTICES.md §3 has to learn the newcomer at the same time.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2023-0071, the Marvin attack on the `rsa` crate (timing side channel in RSA
    # decryption/signing). Reaches swiss twice: sqlx-mysql (caching_sha2 password exchange
    # encrypts the password with the server's public key - swiss holds no private key there)
    # and russh (SSH key auth signs with the user's own key on the user's own machine). Both
    # run on the loopback host against keys the same user already owns, and no upstream has a
    # fixed release; rsa 0.10 is tracked and the ignore goes away with it.
    { id = "RUSTSEC-2023-0071", reason = "no fixed release; both call sites act on the local user's own keys" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    # File-level copyleft only (option-ext, via dirs); linking it into the binary carries no
    # obligation beyond keeping its own files under MPL.
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
# Workspace members reference each other by path with no version - that is the one
# wildcard shape this tree has, and it is intended.
allow-wildcard-paths = true
# The build.yml duplicate check owns the "linked twice" gate for the heavy crates; here a
# duplicate is a warning so a RustCrypto generation gap (russh vs aes-gcm) does not fail CI.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
