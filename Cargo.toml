[workspace]
members = [
    "crates/lmg-core",
    "crates/lmg-host",
    "crates/lmg-mcp",
    "crates/lmg-data",
    "crates/lmg-tunnels",
    "crates/lmg-jobs",
    "crates/lmg-panel",
]
resolver = "2"

[package]
name = "lmg"
version = "0.1.0"
edition = "2021"
description = "One local process that hosts every MCP server an AI client needs, on 127.0.0.1 HTTP paths."
license = "MIT"

[[bin]]
name = "lmg"
path = "src/main.rs"

[dependencies]
lmg-core = { path = "crates/lmg-core" }
lmg-host = { path = "crates/lmg-host" }
lmg-mcp = { path = "crates/lmg-mcp" }
lmg-data = { path = "crates/lmg-data" }
lmg-tunnels = { path = "crates/lmg-tunnels" }
lmg-jobs = { path = "crates/lmg-jobs" }
lmg-panel = { path = "crates/lmg-panel" }
# The rmcp `macros` feature stays off: servers implement ServerHandler by hand, mirroring the
# Node build's setRequestHandler exactly and keeping pastey out of the build.
rmcp = { version = "3.2", default-features = false, features = [
    "server", "client", "transport-streamable-http-server",
    "transport-child-process",
] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", default-features = false, features = [
    "rt", "macros", "net", "time", "signal", "sync", "fs", "io-util", "process",
] }
tower = { version = "0.5", default-features = false, features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
futures-core = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false }
bigdecimal = { version = "0.4", default-features = false }
encoding_rs = { version = "0.8", default-features = false }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
base64 = "0.23"
rand = "0.8"
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing", "macros"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }

[target.'cfg(windows)'.dependencies]
# reqwest on Windows: native-tls = schannel — pure Rust, the OS trust store; rustls would pull
# either aws-lc-rs (CMake/NASM build pain) or ring via a second crypto stack.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "native-tls",
] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",           # DPAPI, replacing the powershell spawn
    "Win32_System_Registry",                 # MachineGuid, direct registry read
    "Win32_System_Threading",                # process-tree walk + open-process
    "Win32_System_JobObjects",               # KILL_ON_JOB_CLOSE subtree kill for proc children
    "Win32_System_Diagnostics_ToolHelp",     # Toolhelp32 snapshot, replacing the other powershell spawn
    "Win32_System_ProcessStatus",            # GetProcessMemoryInfo for the memory view
] }

# --- tunnel deps (agent-managed) ---
# The tunnels agent appends russh here. Do not move or reformat this marker section.
russh = { version = "0.63.2", default-features = false, features = [
    "ring", "rsa", "des",
] }
socket2 = "0.6"

[target.'cfg(not(windows))'.dependencies]
# reqwest on unix: rustls so a downloaded binary needs no system OpenSSL.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
libc = "0.2"

[dev-dependencies]
# Test-only: a real MCP client (rmcp's own) against the gateway over a real socket, plus raw-HTTP
# probes for the 2025-era handshake. Dev-deps do not enter the shipping binary's feature set.
lmg-core = { path = "crates/lmg-core", features = ["test-utils"] }
lmg-mcp = { path = "crates/lmg-mcp", features = ["test-utils"] }
rmcp = { version = "3.2", default-features = false, features = [
    "client", "transport-streamable-http-client-reqwest",
] }
# `test-util` only: a pausable clock, so the tunnel manager's reconnect backoff can be asserted
# over a quarter hour of simulated outage in microseconds. Resolver v2 keeps a dev-dependency
# feature out of `cargo build`, so the shipping binary carries none of it.
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "native-tls",
] }

[target.'cfg(not(windows))'.dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }

[features]
default = []
# The heaviest driver, worth an estimated 3-5 MB — off by default for user builds, ON in the
# shipped release (ADR-004). Forwards to the crate that carries the driver (lmg-mcp); a
# configured mongo MCP on a featureless build fails with an error naming the feature, never
# a panic and never a silently missing endpoint.
mongo = ["lmg-mcp/mongo"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
