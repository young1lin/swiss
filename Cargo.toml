[workspace]
members = [
    "crates/swiss-core",
    # The event bus (SPEC §bus). A foundation crate: swiss-host holds it, and a
    # subsystem that publishes may name it. It names none of them.
    "crates/swiss-bus",
    "crates/swiss-host",
    "crates/swiss-mcp",
    "crates/swiss-data",
    "crates/swiss-tunnels",
    "crates/swiss-jobs",
    "crates/swiss-terminal",
    "crates/swiss-panel",
    "crates/swiss-process",
    "crates/swiss-remote",
    # The long-term memory subsystem (SPEC §memory): records, scope, the SQLite+FTS5
    # store and search. Free of axum by design - the routes and the MCP handler live in
    # swiss-plugins like terminal's and remote's, the CLI dispatch in the root crate.
    "crates/swiss-memory",
    # The model hub (SPEC §llm): named providers, the embedding endpoint, agents and their
    # OTLP telemetry. Free of axum like swiss-memory; the plugin wrapper and /api/llm live
    # in swiss-plugins.
    "crates/swiss-llm",
    # The plugin wrappers (SPEC §arch.crates): terminal, remote, process, memory and llm put
    # on the host. The one crate besides the root that names several subsystem crates, and
    # only the root names it.
    "crates/swiss-plugins",
    # The dev-only integration harness (SPEC §testing.it): nothing depends on it, and every
    # dependency hides behind its `it` feature, so gate 1 builds it as three empty
    # targets and a machine without Docker sees no difference at all.
    "crates/swiss-it",
]
# The protobuf generator (SPEC §bus.codegen). prost-build and protox stay out of the
# shipping graph and out of `cargo test --workspace`. It has its own lockfile.
exclude = ["crates/swiss-bus/protogen"]
resolver = "2"

# Shared by every member crate (`<field>.workspace = true`): one author, one license, one
# MSRV. rust-version is the toolchain the suite is green on; CI builds on stable.
[workspace.package]
authors = ["young1lin"]
license = "Apache-2.0"
repository = "https://github.com/young1lin/swiss"
rust-version = "1.98"
version = "0.2.1"
# Shipped as release archives (README, Install), not through crates.io: a stray `cargo publish`
# would claim ten crate names for one binary. Lift this only with a plan to publish all ten.
publish = false

[package]
name = "swiss"
version.workspace = true
edition = "2021"
readme = "README.md"
description = "A developer's pocket multitool: one tiny local process, every tool behind one loopback port."
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "swiss"
path = "src/main.rs"

[dependencies]
swiss-core = { path = "crates/swiss-core" }
# The event bus (SPEC §bus). The composition mounts GET /api/bus and injects the panel stamp.
swiss-bus = { path = "crates/swiss-bus" }
swiss-host = { path = "crates/swiss-host" }
swiss-mcp = { path = "crates/swiss-mcp" }
swiss-data = { path = "crates/swiss-data" }
swiss-tunnels = { path = "crates/swiss-tunnels" }
swiss-jobs = { path = "crates/swiss-jobs" }
# The terminal session machine (SPEC §terminal.sessions): routes and the plugin wrapper live in
# swiss-plugins; the crate itself stays free of axum so its tests need no server.
swiss-terminal = { path = "crates/swiss-terminal" }
swiss-panel = { path = "crates/swiss-panel" }
# The remote-execution subsystem (SPEC §remote): targets, actions and the /api/remote routes;
# the plugin wrapper lives in swiss-plugins like terminal's.
swiss-remote = { path = "crates/swiss-remote" }
# The long-term memory subsystem (SPEC §memory): the store stays offline-capable and
# axum-free; the CLI dispatch lives in this crate's src/, the /api/knowledge routes and the
# builtin memory MCP handler in swiss-plugins.
swiss-memory = { path = "crates/swiss-memory" }
# The model hub (SPEC §llm): the llm plugin's engine, and what memory's semantic tier and
# sync agent read through the one LlmState the composition shares.
swiss-llm = { path = "crates/swiss-llm" }
# The managed-apps subsystem (SPEC §process.apps): engines, history, logs and the
# /api/process routes; the plugin wrapper lives in swiss-plugins.
swiss-process = { path = "crates/swiss-process" }
# The plugin wrappers: server.rs registers and mounts them, builtin.rs registers process.
swiss-plugins = { path = "crates/swiss-plugins" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
tokio = { version = "1", default-features = false, features = [
    "rt", "macros", "net", "time", "signal", "sync", "fs", "io-util", "process",
] }
tower = { version = "0.5", default-features = false, features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
futures-core = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bigdecimal = { version = "0.4", default-features = false }
encoding_rs = { version = "0.8", default-features = false }
# `swiss remote exec` reads a `sh -c` script the way the far shell would, to catch one that
# PowerShell cut apart before it ships (SPEC §remote.cli). Same crate and version as swiss-host's.
shlex = "2"
base64 = "0.23"
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing", "macros"] }
# The admin session cookie's HMAC-SHA256 (SPEC §host.session). Both are already in the tree through
# swiss-core's hkdf (same versions resolve), so the direct edges cost no code.
hmac = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }

[target.'cfg(windows)'.dependencies]
# reqwest on Windows: native-tls = schannel — pure Rust, the OS trust store; rustls would pull
# either aws-lc-rs (CMake/NASM build pain) or ring via a second crypto stack.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "native-tls",
] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",           # DPAPI, replacing the powershell spawn
    "Win32_System_Registry",                 # MachineGuid, direct registry read
    "Win32_System_Threading",                # process-tree walk + open-process, and the gui
                                             # single-instance mutex (SPEC §host.gui)
    "Win32_System_JobObjects",               # KILL_ON_JOB_CLOSE subtree kill for proc children
    "Win32_System_Diagnostics_ToolHelp",     # Toolhelp32 snapshot, replacing the other powershell spawn
    "Win32_System_ProcessStatus",            # GetProcessMemoryInfo for the memory view
] }

# --- tunnel deps (agent-managed) ---
# The tunnels agent appends russh here. Do not move or reformat this marker section.
russh = { version = "0.65.1", default-features = false, features = [
    "ring", "rsa", "des",
] }
socket2 = "0.6"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# Reuse the same shell on both desktops: system WebView2 on Windows, WKWebView on macOS.
# No embedded browser engine, bundler, TLS stack or additional async runtime (SPEC §host.gui).
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(not(windows))'.dependencies]
# reqwest on unix: rustls so a downloaded binary needs no system OpenSSL.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
libc = "0.2"

[dev-dependencies]
# Test-only: a real MCP client (rmcp's own) against the gateway over a real socket, plus raw-HTTP
# probes for the 2025-era handshake. Dev-deps do not enter the shipping binary's feature set.
swiss-core = { path = "crates/swiss-core", version = "0.2.1", features = ["test-utils"] }
swiss-mcp = { path = "crates/swiss-mcp", version = "0.2.1", features = ["test-utils"] }
rmcp = { version = "3.2", default-features = false, features = [
    "client", "transport-streamable-http-client-reqwest",
] }
# `test-util` only: a pausable clock, so the tunnel manager's reconnect backoff can be asserted
# over a quarter hour of simulated outage in microseconds. Resolver v2 keeps a dev-dependency
# feature out of `cargo build`, so the shipping binary carries none of it.
tokio = { version = "1", features = ["test-util"] }
# The real WebSocket client the terminal route tests drive handshakes with (SPEC §terminal.api).
# The same crate axum's ws feature already compiled in, with no TLS feature — the gateway
# is loopback, so the test talks ws:// to 127.0.0.1 and nothing else enters the build.
tokio-tungstenite = { version = "0.29", default-features = false, features = [
    "connect",
] }

[target.'cfg(windows)'.dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "native-tls",
] }

[target.'cfg(not(windows))'.dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }

[features]
default = []

# Full debuginfo is what makes a debug build of this workspace unbuildable on a small paging
# file: eight link targets, each carrying a complete PDB, exhaust it (os error 1455) when cargo
# links them in parallel — which is why every gate run so far has had to pass
# CARGO_PROFILE_DEV_DEBUG=line-tables-only by hand. Putting it here instead means the gate
# commands in AGENTS.md are the whole story, with no environment variable written down nowhere.
# Line tables keep what is actually read (a panic or a failing assert still names its file and
# line) and drop what is not. Costs nothing at runtime: this profile never ships.
#
# Deliberately not `[profile.dev.package."*"] debug = 0`, tempting as it is: dependency
# debuginfo is most of the bytes, but changing it invalidates every dependency in the target
# directory, and on a machine with Smart App Control that means several hundred freshly linked
# build scripts and proc-macro DLLs for the OS to refuse one at a time.
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# The quick deploy's build, `scripts/deploy.ps1 -Quick` (SPEC §host.ops): the release profile
# without its whole-program pass. Fat LTO over one codegen unit is most of a release build's
# minutes and buys a smaller exe, not a different one; a deploy made to see a change live trades
# those bytes for minutes. It builds into target\quick, so neither profile's artifacts are
# rebuilt for the other, and incremental keeps a rebuild to the crates that changed. Measured
# 2026-10-27 on one changed swiss-host constant: release rebuilt the twelve workspace crates in
# 559 s, quick in 9 s (its first, cold build took 477 s); the exe is 28.3 MB against 20.0 MB.
[profile.quick]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true
