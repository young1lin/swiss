<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="swiss">
  <!-- swiss: a red tile with three tools fanned open from one rivet - the multitool,
       drawn from scratch. No shield, no cross: those shapes belong to other people. -->
  <rect width="64" height="64" rx="14" fill="#DA291C"/>
  <g fill="#fff">
    <rect x="18" y="42" width="34" height="8" rx="4"/>
    <rect x="18" y="42" width="30" height="8" rx="4" transform="rotate(-32 18 46)"/>
    <rect x="18" y="42" width="26" height="8" rx="4" transform="rotate(-64 18 46)"/>
    <circle cx="18" cy="46" r="7"/>
  </g>
  <circle cx="18" cy="46" r="2.4" fill="#DA291C"/>
</svg>
